# Krea2 角色 LoRA 数据集配置（musubi-tuner / kohya 兼容 toml）
# 用法：krea2_cache_latents.py --dataset_config <本文件> --vae ...
# 目录约定：每个角色一个子目录，图与同名 .txt caption 平铺（caption 首词即触发词）

[general]
resolution = [1024, 1024]
caption_extension = ".txt"
enable_bucket = true
bucket_no_upscale = false
batch_size = 1

[[datasets]]
image_directory = "K:/Fluxgroup/FluxGroup/media/mv0001-handover/cast-dataset/xq_her"
num_repeats = 4

