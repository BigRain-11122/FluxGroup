# 产品配方：内容组（2026-11-02 定）
# 说明：这是一个"配方"，不是计划书。机器按它派活、按它验收。

product: content
name: 内容组（MV / 短剧 / 漫剧，出海）
status: active
owner: 导演席（AI 席位；人审由 CEO 终判）
lane: [bm-c, bm-b, bm-a]          # bm-c 出图出片，bm-b 配音，bm-a 装配
checker: 质检席（四件闸 + 观众三层）
outlet: 平台发布（草稿由组出，签名权在 CEO）

chain:
  - C1 选题：原著/歌词/爆款拆解 → 一页立意案
  - C2 生产：角色圣经 → 关键帧 → 出片 → 装配
  - C3 闸：交付/转场/逐镜/稳定四件 + 静音复述
  - C4 分发：隐式标识 + 平台声明 + 发布回执

acceptance:
  - 成片在盘，时长与分辨率达标，且能被 ffprobe 读出
  - 四件闸全 PASS（seam=0, freeze=0, OPPOSE=0, 重复镜在白名单内）
  - 观众三层：L1 路人 5 人里 ≥4 人静音看懂主线；L2 老粉 3 秒认出；L3 专业能点名一个手法
  - 发布回执：平台、链接、时间三项齐全

fixed_deliverables:
  - 每周：1 条 30 秒可发布片（含闸与回执）
  - 每两周：1 集 6 分钟样片（同一世界/同一角色）
  - 每月：1 次"下个月拍什么"的一页决定

unit_economics:
  price: 精品定制 2-3 万元/分钟（海外分账另计）
  cost: 单集 100-3000 元（本地算力为主）
  break_even: 每月卖出 2 分钟精品即覆盖当月机器成本

kill_criteria:
  - 连续 4 周没有任何一条发布回执 → 停线复盘，不再派新卡
  - 同一类缺陷（跳动/转场/一致性）连续 3 条片复发 → 停线，先修闸