# 产品配方：策略组（2026-11-02 定）
# 说明：这是 19.9 算力包这一门生意的配方。机器按它派活、按它验收。

product: strategy
name: 策略组（策略算力包 19.9）
status: active
owner: 量化席（AI 席位；定价与对外承诺由 CEO）
lane: [bm-b, bm-d]                # 回测与数据；bm-d 未入网时只排 bm-b
checker: 风控席（回测闸 + 数据指纹）
outlet: BigDomain 页面 + 私域收钱；组内自决定价 19.9–29.9 并报备

chain:
  - C1 因子：候选池 → 可回测的一页假设
  - C2 回测：数据指纹 → 跑批 → 结论
  - C3 审计：样本内外分离、成本计入、无未来函数
  - C4 前台：一句话 → 回测页（≤3 分钟）
  - C6 收费：19.9 单次；不卖关卡、不卖预测、不代客实盘

acceptance:
  - 结论一页在盘，含年化/最大回撤/夏普/样本期/交易次数五个数
  - 可复跑：同数据同参数，重跑结果一致（带数据指纹）
  - 前台可用：输入一句话到看到结果 ≤3 分钟
  - 合规：不出现收益承诺、不出现"必涨"类措辞

fixed_deliverables:
  - 每天：1 份回测结论（一页 + 数据指针）
  - 每月：1 次策略去留决定（上线/下线/继续观察，带理由）
  - 上线后：每笔 19.9 订单有回执与结果页

unit_economics:
  price: 19.9 元/次
  cost: 单次回测机时（本地为主，≤0.5 元）
  break_even: 每月 200 单覆盖机队电费与折旧

kill_criteria:
  - 60 天内没有第一笔付费，且没有写明阻断原因 → 停线
  - 连续 3 周没有一份可复跑的回测结论 → 停线，先修数据链
  - 出现一次"数据与结论对不上" → 全线暂停，先做数据审计