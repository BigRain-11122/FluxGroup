# 产品配方：游戏组（2026-11-02 定）
# 说明：Biggame 是集团重要业务方向，独立成组，不并进内容组。

product: game
name: 游戏组（轻量 2D 小游戏）
status: active
owner: 游戏席（AI 席位；玩法与上线由 CEO 定）
lane: [bm-a, bm-c]                # bm-a 构建装配，bm-c 美术出图
checker: 质检席（可玩性 + 包体 + 合规三闸）
outlet: 微信小游戏 / 海外超休闲 / 车机适配（对外上架由 CEO 签名）

# 硬约束：只做 2D，不碰 3D（CEO 2026-09-23 令）
constraints:
  - 2D only（引擎原生 2D，无 3D 模型/相机）
  - 一块屏多人可玩（车机不分屏）
  - 不做失败惩罚（儿童场景不哭）
  - 单局 60-90 秒

chain:
  - G1 玩法：一句话说清"这一关让人产生哪种情绪"（三关情绪不许重复）
  - G2 原型：单文件可玩原型（双击即玩，浏览器实测）
  - G3 美术：整屏出图 → 原位拆层 → 透明件（禁单件拼）
  - G4 打包：微信小游戏包 / 车机包
  - G5 闸：可玩性、包体、合规（零真人脸、品牌规避、儿童场景）

acceptance:
  - 有可玩包：能双击或扫码进入，玩满 3 分钟不报错
  - 前 3 关三种不同强情绪，首个"哇"点 ≤5 秒
  - 包体达标，真机（或模拟器）跑通，帧率稳定
  - 上架材料齐：图标、截图、简介、隐私说明、软著号

fixed_deliverables:
  - 每两周：1 个可玩包（含 3 关）
  - 每月：1 份"下一款做什么"的一页决定
  - 上线后：每周一次数据回填（留存、时长、广告/付费）

unit_economics:
  price: IAA 广告分成 / 内购 6-28 元 / 车机适配费
  cost: 单款原型 3-7 天 AI 工时（本地算力）
  break_even: 一款小游戏月流水 ≥ 机器折旧即继续，否则换题

kill_criteria:
  - 30 天内没有可玩包 → 停这款，换题
  - 连续 2 款上线后 7 日留存 <15% → 停这条玩法方向
  - 出现合规问题（真人脸/侵权素材）→ 全线暂停