# CH01 角色 LoRA 数据集配置（首个跑通管道用的最小集）
# 12 张 1024² 多视角图 + 12 条设定档 caption（触发词 ch01face），
# 重复度体检 PASS（dHash 中位数 104、重复对 0/66）。
# 用法：krea2_cache_latents.py --dataset_config <本文件> --vae <qwen_image_vae>

[general]
resolution = [1024, 1024]
caption_extension = ".txt"
enable_bucket = true
bucket_no_upscale = false
batch_size = 1

[[datasets]]
image_directory = "K:/Fluxgroup/FluxGroup/media/asset/faces/CH01"
num_repeats = 6
