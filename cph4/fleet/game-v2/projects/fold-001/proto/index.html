<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fold It · 折一折 · 手感原型 v0.1</title>
<style>
  :root{ --page:#E4D8C2; --ink:#3A3733; --accent:#B4553C; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--page);overflow:hidden}
  body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
       color:var(--ink);-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none;cursor:default}

  #ui{position:absolute;inset:0;pointer-events:none}

  /* 调试计时（角落，仅开发用） */
  #timer{
    position:absolute;left:14px;top:12px;
    font:11px/1.5 ui-monospace,Consolas,"Courier New",monospace;
    color:rgba(58,55,51,.52);white-space:pre;letter-spacing:.2px;
  }

  #btns{position:absolute;right:14px;top:10px;display:flex;gap:8px;pointer-events:auto}
  #btns button{
    font:600 13px/1 "Microsoft YaHei",system-ui,sans-serif;
    padding:9px 14px;border-radius:10px;cursor:pointer;
    border:1px solid rgba(58,55,51,.22);
    background:#F7EFDF;color:var(--ink);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 2px 6px rgba(58,55,51,.10);
    transition:background .12s,transform .08s;
  }
  #btns button:hover{background:#FFF9EC}
  #btns button:active{transform:translateY(1px)}

  #help{
    position:absolute;left:14px;bottom:8px;max-width:660px;
    font:12px/1.6 "Microsoft YaHei",system-ui,sans-serif;
    color:rgba(58,55,51,.55);pointer-events:none;
  }
  #help b{color:rgba(58,55,51,.8)}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="timer"></div>
    <div id="btns">
      <button id="bUndo" title="撤销上一折 (Ctrl+Z)">↶ 撤销</button>
      <button id="bDemo" title="自动折完本轮并放进抽屉，方便录屏">▶ 演示</button>
      <button id="bReset" title="清空抽屉，从第 1 件重来">⟳ 重置</button>
    </div>
    <div id="help">
      <b>按住衣服</b> → 沿亮起的那条虚线方向拖 → <b>松手</b>自动折完（≥25° 才落定）。
      折完把衣服拖进右边抽屉格位；点格位里的衣服可以<b>拿起重放</b>。
    </div>
  </div>
</div>

<script>
(function () {
"use strict";

/* ============================================================
   Fold It · 3 天手感原型（FOLD-001 / proto v0.1）
   验证：折（镜像 + 折痕 + 咔）/ 空间装箱 / 无失败态 / 10 秒钩子
   纯 HTML/CSS/JS，无依赖、无外部资源、0 出站请求。
   ============================================================ */

// ------------------------------------------------------------- 常量
const CFG = {
  W: 1200, H: 720,
  GRID: 20,          // 20×20 网格（规格 16×16 为下限，取 20 让剪影更易读）
  UNIT: 420,         // 单位纸面 0..1 → 像素
  SLOT_CAP: 3,       // 一格 3 件（规格 4–6 的简化）
  FOLD_DUR: 0.15,    // 折叠动画 150ms
  FOLD_MIN_DEG: 25,  // 松手阈值
  SNAP_PX: 46        // 折线吸附半径
};

const COL = {
  page:'#E4D8C2', desk:'#F2E8D5', drawer:'#EADDC6', slot:'#F4EAD8',
  slotEdge:'rgba(58,55,51,0.20)', ink:'#3A3733', accent:'#B4553C',
  green:'#6E7F5C', blue:'#2E4A62', kraft:'#C89F6B'
};

const DESK   = { x: 36,  y: 88, w: 728, h: 584 };
const DRAWER = { x: 780, y: 88, w: 384, h: 584 };
const SLOT   = { w: 164, h: 164, gap: 16, x0: 800, y0: 136, cols: 2 };

DESK.cx = DESK.x + DESK.w / 2;   // 400
DESK.cy = DESK.y + DESK.h / 2;   // 380

const SLOT_RECTS = [];
for (let i = 0; i < 6; i++) {
  const c = i % SLOT.cols, r = (i / SLOT.cols) | 0;
  SLOT_RECTS.push({
    x: SLOT.x0 + c * (SLOT.w + SLOT.gap),
    y: SLOT.y0 + r * (SLOT.h + SLOT.gap),
    w: SLOT.w, h: SLOT.h
  });
}

const SUGGESTED_SLOT = 0;   // 三件都放第 1 格 → 直接演示「一格 3 件」占位
const DONE_CARD = { w: 400, h: 178 };
DONE_CARD.x = CFG.W / 2 - DONE_CARD.w / 2;
DONE_CARD.y = CFG.H / 2 - DONE_CARD.h / 2;

// ------------------------------------------------------------- 工具
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const nowMs = () => performance.now();

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }
function mixRgb(a, b, t) {
  return [Math.round(lerp(a[0],b[0],t)), Math.round(lerp(a[1],b[1],t)), Math.round(lerp(a[2],b[2],t))];
}
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// ------------------------------------------------------------- 画布 / 视口
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const app = document.getElementById('app');
const view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

function resize() {
  const w = app.clientWidth || window.innerWidth;
  const h = app.clientHeight || window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const s = Math.min(w / CFG.W, h / CFG.H);
  view.scale = s; view.ox = (w - CFG.W * s) / 2; view.oy = (h - CFG.H * s) / 2; view.dpr = dpr;
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * view.ox, dpr * view.oy);
}
window.addEventListener('resize', resize);

function toWorld(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left - view.ox) / view.scale, y: (clientY - r.top - view.oy) / view.scale };
}

// ------------------------------------------------------------- 音频（WebAudio 合成）
let AC = null, MASTER = null, NOISE = null;

function audioInit() {
  if (AC) return;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  AC = new Ctor();
  MASTER = AC.createGain();
  MASTER.gain.value = 0.33;
  MASTER.connect(AC.destination);
  const n = Math.floor(AC.sampleRate * 0.2);
  NOISE = AC.createBuffer(1, n, AC.sampleRate);
  const d = NOISE.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
}
function audioWake() {
  if (!AC) audioInit();
  if (AC && AC.state === 'suspended') AC.resume();
}

// 折痕「咔」：低频撞击 + 纤维颗粒，~100ms
function sfxCrease(soft) {
  if (!AC) return;
  const t = AC.currentTime;
  const g0 = soft ? 0.34 : 0.5;
  const src = AC.createBufferSource(); src.buffer = NOISE;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = soft ? 2100 : 3200; bp.Q.value = 1.1;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(g0, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.095);
  src.connect(bp).connect(g).connect(MASTER);
  src.start(t); src.stop(t + 0.13);

  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(112, t);
  o.frequency.exponentialRampToValueAtTime(58, t + 0.085);
  const g2 = AC.createGain();
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(soft ? 0.28 : 0.42, t + 0.007);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.105);
  o.connect(g2).connect(MASTER);
  o.start(t); o.stop(t + 0.12);
}

// 入格「沙」
function sfxSwish() {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = NOISE;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1250;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.34, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  src.connect(lp).connect(g).connect(MASTER);
  src.start(t); src.stop(t + 0.25);
}

// 完成三音（A07，全作唯一旋律）
function sfxChime() {
  if (!AC) return;
  const t0 = AC.currentTime;
  const fs = [523.25, 659.25, 783.99];
  for (let i = 0; i < fs.length; i++) {
    const t = t0 + i * 0.09;
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = fs[i];
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(g).connect(MASTER);
    o.start(t); o.stop(t + 0.45);
  }
}

// ------------------------------------------------------------- 形状（单位纸面 0..1）
const SHAPES = {
  // T 恤：方肩 + 袖子 + 领口凹槽
  tshirt: [
    [0.00,0.20],[0.20,0.20],[0.20,0.08],[0.38,0.08],[0.50,0.22],[0.62,0.08],
    [0.80,0.08],[0.80,0.20],[1.00,0.20],[1.00,0.42],[0.80,0.42],[0.80,1.00],
    [0.20,1.00],[0.20,0.42],[0.00,0.42]
  ],
  // 裤：腰 + 两条裤腿 + 裆
  pants: [
    [0.20,0.00],[0.80,0.00],[0.80,1.00],[0.55,1.00],[0.53,0.50],
    [0.47,0.50],[0.45,1.00],[0.20,1.00]
  ],
  // 毛巾：横长方形
  towel: [[0.10,0.20],[0.90,0.20],[0.90,0.80],[0.10,0.80]]
};

function pointInPoly(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

function buildCells(poly) {
  const G = CFG.GRID, cells = [];
  for (let gy = 0; gy < G; gy++) {
    for (let gx = 0; gx < G; gx++) {
      const x0 = gx / G, x1 = (gx + 1) / G, y0 = gy / G, y1 = (gy + 1) / G;
      if (!pointInPoly((x0 + x1) / 2, (y0 + y1) / 2, poly)) continue;
      cells.push({ pts: [{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1}], z: 0, flip: 0 });
    }
  }
  return cells;
}

function bboxOfCells(cells) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < cells.length; i++) {
    const p = cells[i].pts;
    for (let k = 0; k < 4; k++) {
      const q = p[k];
      if (q.x < x0) x0 = q.x;
      if (q.x > x1) x1 = q.x;
      if (q.y < y0) y0 = q.y;
      if (q.y > y1) y1 = q.y;
    }
  }
  if (x0 === Infinity) return { x0:0,y0:0,x1:0,y1:0,w:0,h:0,cx:0,cy:0 };
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}

function cloneCells(cells) {
  const out = new Array(cells.length);
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    out[i] = {
      pts: [{x:c.pts[0].x,y:c.pts[0].y},{x:c.pts[1].x,y:c.pts[1].y},
            {x:c.pts[2].x,y:c.pts[2].y},{x:c.pts[3].x,y:c.pts[3].y}],
      z: c.z, flip: c.flip
    };
  }
  return out;
}
function cloneCreases(cs) {
  return cs.map(c => ({ type:c.type, a:{x:c.a.x,y:c.a.y}, b:{x:c.b.x,y:c.b.y} }));
}

// ------------------------------------------------------------- 关卡
// 折线 = 「当前包围盒的比例」，落位时吸附到网格线（保证镜像后仍在网格上）
const LEVELS = [
  { id:'L1', name:'T 恤 · 对折', cloth:'tshirt', color: COL.green,
    steps: [
      { sol:{ type:'v', at:0.5, side:1 }, alts:[{type:'h',at:0.5},{type:'v',at:0.34}] },
      { sol:{ type:'h', at:0.5, side:1 }, alts:[{type:'v',at:0.5},{type:'h',at:0.34}] }
    ] },
  { id:'L2', name:'裤 · 三折', cloth:'pants', color: COL.blue,
    steps: [
      { sol:{ type:'h', at:0.667, side:1 }, alts:[{type:'h',at:0.5},{type:'v',at:0.5}] },
      { sol:{ type:'h', at:0.5,   side:-1 }, alts:[{type:'h',at:0.34},{type:'v',at:0.5}] }
    ] },
  { id:'L3', name:'毛巾 · 卷', cloth:'towel', color: COL.kraft,
    steps: [
      { sol:{ type:'h', at:0.72, side:1 }, alts:[{type:'h',at:0.5},{type:'v',at:0.5}] },
      { sol:{ type:'h', at:0.68, side:1 }, alts:[{type:'h',at:0.5},{type:'v',at:0.5}] },
      { sol:{ type:'h', at:0.62, side:1 }, alts:[{type:'h',at:0.45},{type:'v',at:0.5}] }
    ] }
];

// ------------------------------------------------------------- 状态
const state = {
  t0: nowMs(), firstFold: null, firstSlot: null,
  levelIndex: 0, levelStart: nowMs(), levelTimes: [],
  piece: null, flying: null, slots: [], undoStack: [],
  drag: null, demo: null, allDone: false, fx: [], toast: null
};
for (let i = 0; i < 6; i++) state.slots.push({ items: [] });

function toast(msg) { state.toast = { msg, t: 0, dur: 2.4 }; }

// ------------------------------------------------------------- 关卡生命周期
function newLevel(i) {
  state.levelIndex = i;
  const L = LEVELS[i];
  state.piece = {
    level: i, name: L.name, color: L.color, rgb: hexToRgb(L.color),
    cells: buildCells(SHAPES[L.cloth]),
    creases: [], stepIndex: 0, ready: false,
    off: { x:0, y:0 }, offAnim: null, preview: null, anim: null, marks: []
  };
  state.undoStack = [];
  state.drag = null;
  state.levelStart = nowMs();
}

function axisFromSpec(spec, bb) {
  let pos = (spec.type === 'v') ? bb.x0 + bb.w * spec.at : bb.y0 + bb.h * spec.at;
  pos = Math.round(pos * CFG.GRID) / CFG.GRID;   // 吸到网格线
  return { type: spec.type, pos, side: spec.side || 1 };
}

function axisStats(cells, axis) {
  let pos = 0, neg = 0;
  for (let i = 0; i < cells.length; i++) {
    const p = cells[i].pts;
    const cx = (p[0].x + p[1].x + p[2].x + p[3].x) / 4;
    const cy = (p[0].y + p[1].y + p[2].y + p[3].y) / 4;
    const d = (axis.type === 'v') ? cx - axis.pos : cy - axis.pos;
    if (d > 1e-6) pos++; else if (d < -1e-6) neg++;
  }
  return { pos, neg };
}

function candidates(piece) {
  const step = LEVELS[piece.level].steps[piece.stepIndex];
  if (!step) return [];
  const bb = bboxOfCells(piece.cells);
  const out = [];
  function push(spec, sol) {
    const a = axisFromSpec(spec, bb);
    const st = axisStats(piece.cells, a);
    if (st.pos === 0 || st.neg === 0) return;
    for (let i = 0; i < out.length; i++) {
      if (out[i].type === a.type && Math.abs(out[i].pos - a.pos) < 1e-6) return;
    }
    out.push({ type:a.type, pos:a.pos, side:a.side, sol });
  }
  push(step.sol, true);
  for (let i = 0; i < step.alts.length; i++) push(step.alts[i], false);
  return out;
}

// ------------------------------------------------------------- 折叠
function applyFold(cells, axis) {
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i], p = c.pts;
    const cx = (p[0].x + p[1].x + p[2].x + p[3].x) / 4;
    const cy = (p[0].y + p[1].y + p[2].y + p[3].y) / 4;
    const d = (axis.type === 'v' ? cx - axis.pos : cy - axis.pos) * axis.side;
    if (d > 1e-6) {
      for (let k = 0; k < 4; k++) {
        if (axis.type === 'v') p[k].x = 2 * axis.pos - p[k].x;
        else                   p[k].y = 2 * axis.pos - p[k].y;
      }
      p.reverse();       // 保持绕向（剪影合并 + 阴影）
      c.z += 10;
      c.flip += 1;
    }
  }
}

function snapshot(piece) {
  return {
    cells: cloneCells(piece.cells),
    creases: cloneCreases(piece.creases),
    stepIndex: piece.stepIndex,
    marks: piece.marks.slice(),
    ready: piece.ready
  };
}

function commitFold(axis, isSolution) {
  const piece = state.piece;
  if (!piece) return;

  const bb = bboxOfCells(piece.cells);
  const crease = (axis.type === 'v')
    ? { type:'v', a:{x:axis.pos, y:bb.y0}, b:{x:axis.pos, y:bb.y1} }
    : { type:'h', a:{x:bb.x0, y:axis.pos}, b:{x:bb.x1, y:axis.pos} };

  state.undoStack.push(snapshot(piece));
  if (state.undoStack.length > 32) state.undoStack.shift();

  // 旧折痕随折一起走
  for (let i = 0; i < piece.creases.length; i++) {
    const cr = piece.creases[i];
    const mx = (cr.a.x + cr.b.x) / 2, my = (cr.a.y + cr.b.y) / 2;
    const d = (axis.type === 'v' ? mx - axis.pos : my - axis.pos) * axis.side;
    if (d > 1e-6) {
      if (axis.type === 'v') { cr.a.x = 2*axis.pos - cr.a.x; cr.b.x = 2*axis.pos - cr.b.x; }
      else                   { cr.a.y = 2*axis.pos - cr.a.y; cr.b.y = 2*axis.pos - cr.b.y; }
      const t = cr.a; cr.a = cr.b; cr.b = t;
    }
  }

  applyFold(piece.cells, axis);
  piece.creases.push(crease);
  piece.preview = null;
  piece.stepIndex++;
  piece.marks.push(!!isSolution);

  const mid = (axis.type === 'v')
    ? { x: axis.pos, y: (bb.y0 + bb.y1) / 2 }
    : { x: (bb.x0 + bb.x1) / 2, y: axis.pos };
  state.fx.push({ kind:'crease', t:0, dur:0.34, x:mid.x, y:mid.y,
                  axis:{type:axis.type}, ext: (axis.type === 'v' ? bb.h : bb.w) });
  sfxCrease(!isSolution);

  if (state.firstFold === null) state.firstFold = nowMs() - state.t0;

  if (piece.stepIndex >= LEVELS[piece.level].steps.length) {
    piece.ready = true;
    piece.offAnim = { t:0, dur:0.24, from:{x:piece.off.x, y:piece.off.y}, to:{x:0,y:0} };
  }
}

function startFoldAnim(axis, fromDeg) {
  if (!state.piece) return;
  state.piece.anim = { kind:'fold', axis, from:fromDeg, t:0, dur:CFG.FOLD_DUR };
}
function startAbortAnim(axis, fromDeg) {
  if (!state.piece) return;
  state.piece.anim = { kind:'abort', axis, from:fromDeg, t:0, dur:0.14 };
}

function undo() {
  const piece = state.piece;
  if (!piece || state.undoStack.length === 0) return;
  const s = state.undoStack.pop();
  piece.cells = s.cells;
  piece.creases = s.creases;
  piece.stepIndex = s.stepIndex;
  piece.marks = s.marks;
  piece.ready = s.ready;
  piece.preview = null; piece.anim = null; piece.offAnim = null;
  sfxSwish();
}

// ------------------------------------------------------------- 放置
function dropIntoSlot(slotIdx) {
  const piece = state.piece;
  if (!piece || !piece.ready) return false;
  const slot = state.slots[slotIdx];
  if (slot.items.length >= CFG.SLOT_CAP) {
    toast('这一格满了 · 换一格，或点格里的衣服拿起来');
    return false;
  }
  const r = SLOT_RECTS[slotIdx];
  const bb = bboxOfCells(piece.cells);
  state.flying = {
    cells: cloneCells(piece.cells),
    color: piece.color, rgb: piece.rgb, creases: cloneCreases(piece.creases),
    bbC: { x: bb.cx, y: bb.cy },
    from: { x: DESK.cx + piece.off.x, y: DESK.cy + piece.off.y },
    to:   { x: r.x + r.w / 2, y: r.y + r.h / 2 },
    s0: CFG.UNIT,
    s1: Math.min((r.w - 30) / Math.max(bb.w, 1e-6), (r.h - 46) / Math.max(bb.h, 1e-6)),
    t: 0, dur: 0.22, slot: slotIdx,
    elapsed: nowMs() - state.levelStart, name: piece.name
  };
  state.piece = null;
  state.drag = null;
  sfxSwish();
  return true;
}

function finishFly() {
  const f = state.flying;
  state.flying = null;
  state.slots[f.slot].items.push({ cells:f.cells, color:f.color, rgb:f.rgb, name:f.name });
  state.levelTimes.push({ id: LEVELS[state.levelIndex].id, ms: f.elapsed, slot: f.slot });
  if (state.firstSlot === null) state.firstSlot = nowMs() - state.t0;

  if (state.levelIndex + 1 < LEVELS.length) {
    newLevel(state.levelIndex + 1);
    if (state.demo) { state.demo.phase = 'wait'; state.demo.t = 0; }
  } else {
    state.allDone = true;
    sfxChime();
    if (state.demo) state.demo = null;
  }
}

function pickUp(slotIdx, itemIdx) {
  const slot = state.slots[slotIdx];
  const it = slot.items[itemIdx];
  if (!it) return;
  slot.items.splice(itemIdx, 1);
  state.piece = {
    level: state.levelIndex, name: it.name, color: it.color, rgb: it.rgb,
    cells: it.cells, creases: cloneCreases(it.creases || []),
    stepIndex: LEVELS[state.levelIndex].steps.length, ready: true,
    off:{x:0,y:0}, offAnim:null, preview:null, anim:null, marks: []
  };
  state.undoStack = [];
  sfxSwish();
  toast('拿起来了 · 换个格位再放');
}

// ------------------------------------------------------------- 指针交互
function pieceOrigin(piece) {
  const bb = bboxOfCells(piece.cells);
  return { x: DESK.cx - bb.cx * CFG.UNIT + piece.off.x, y: DESK.cy - bb.cy * CFG.UNIT + piece.off.y };
}

function hitPiece(w) {
  const piece = state.piece;
  if (!piece) return false;
  const o = pieceOrigin(piece), bb = bboxOfCells(piece.cells), pad = 18;
  return w.x >= o.x + bb.x0 * CFG.UNIT - pad && w.x <= o.x + bb.x1 * CFG.UNIT + pad &&
         w.y >= o.y + bb.y0 * CFG.UNIT - pad && w.y <= o.y + bb.y1 * CFG.UNIT + pad;
}

function pickAxis(w) {
  const piece = state.piece;
  if (!piece || piece.ready) return null;
  const cs = candidates(piece);
  const o = pieceOrigin(piece), bb = bboxOfCells(piece.cells);
  let best = null, bestScore = Infinity;

  for (let i = 0; i < cs.length; i++) {
    const a = cs[i];
    const sp = (a.type === 'v') ? o.x + a.pos * CFG.UNIT : o.y + a.pos * CFG.UNIT;
    const d = Math.abs((a.type === 'v') ? (w.x - sp) : (w.y - sp));
    if (d > CFG.SNAP_PX) continue;                    // 不在吸附半径
    if (a.type === 'v') {
      const y0 = o.y + bb.y0 * CFG.UNIT, y1 = o.y + bb.y1 * CFG.UNIT;
      if (w.y < y0 - 30 || w.y > y1 + 30) continue;
    } else {
      const x0 = o.x + bb.x0 * CFG.UNIT, x1 = o.x + bb.x1 * CFG.UNIT;
      if (w.x < x0 - 30 || w.x > x1 + 30) continue;
    }
    // 解优先：两条线在交叉点等距时，亮的（解）永远赢
    const score = d - (a.sol ? 6 : 0);
    if (score < bestScore) { bestScore = score; best = a; }
  }
  return best;
}

function slotAt(w) {
  for (let i = 0; i < SLOT_RECTS.length; i++) {
    const r = SLOT_RECTS[i];
    if (w.x >= r.x && w.x <= r.x + r.w && w.y >= r.y && w.y <= r.y + r.h) return i;
  }
  return -1;
}

function firstFreeSlot() {
  for (let i = 0; i < 6; i++) if (state.slots[i].items.length < CFG.SLOT_CAP) return i;
  return -1;
}

function onDown(w) {
  audioWake();

  // 收完三件后点卡片 → 再来一轮（保留抽屉，看「格子满了」怎么处理）
  if (state.allDone) {
    if (w.x >= DONE_CARD.x && w.x <= DONE_CARD.x + DONE_CARD.w &&
        w.y >= DONE_CARD.y && w.y <= DONE_CARD.y + DONE_CARD.h) {
      state.allDone = false;
      state.levelTimes.length = 0;
      newLevel(0);
    }
    return;
  }

  if (state.flying) return;
  if (state.demo) state.demo = null;

  // 1) 点格位里的衣服 → 拿起重放（桌上那件还没开始折才允许，避免丢进度）
  const si = slotAt(w);
  if (si >= 0 && state.slots[si].items.length) {
    if (!state.piece || state.piece.stepIndex === 0) {
      pickUp(si, state.slots[si].items.length - 1);
      return;
    }
    toast('先把桌上这件收进格子，再拿起别的');
    return;
  }

  const piece = state.piece;
  if (!piece) return;

  // 2) 抓折线 → 折
  const axis = pickAxis(w);
  if (axis) {
    const o = pieceOrigin(piece);
    const side = (axis.type === 'v')
      ? (w.x >= o.x + axis.pos * CFG.UNIT ? 1 : -1)
      : (w.y >= o.y + axis.pos * CFG.UNIT ? 1 : -1);
    const bb = bboxOfCells(piece.cells);
    const spanUnit = side > 0
      ? (axis.type === 'v' ? bb.x1 - axis.pos : bb.y1 - axis.pos)
      : (axis.type === 'v' ? axis.pos - bb.x0 : axis.pos - bb.y0);
    if (spanUnit > 0.02) {
      state.drag = {
        kind:'fold',
        axis:{ type:axis.type, pos:axis.pos, side, sol: axis.sol },
        start:{ x:w.x, y:w.y },
        span: spanUnit * CFG.UNIT,
        angle: 0
      };
      piece.preview = { type:axis.type, pos:axis.pos, side, cos: 1 };
      return;
    }
  }

  // 3) 抓衣服本体 → 平移
  if (hitPiece(w)) {
    state.drag = { kind:'move', start:{x:w.x,y:w.y}, off0:{x:piece.off.x,y:piece.off.y} };
    piece.offAnim = null;
  }
}

function onMove(w) {
  const d = state.drag;
  if (!d) return;
  const piece = state.piece;
  if (!piece) return;

  if (d.kind === 'fold') {
    const n = (d.axis.type === 'v') ? { x:d.axis.side, y:0 } : { x:0, y:d.axis.side };
    const mv = { x: w.x - d.start.x, y: w.y - d.start.y };
    const m = mv.x * n.x + mv.y * n.y;
    const prog = clamp(-m / d.span, 0, 1);
    d.angle = prog * 180;
    piece.preview = { type:d.axis.type, pos:d.axis.pos, side:d.axis.side,
                      cos: Math.cos(d.angle * Math.PI / 180) };
  } else if (d.kind === 'move') {
    piece.off.x = d.off0.x + (w.x - d.start.x);
    piece.off.y = d.off0.y + (w.y - d.start.y);
  }
}

function onUp(w) {
  const d = state.drag;
  state.drag = null;
  const piece = state.piece;
  if (!d || !piece) return;

  if (d.kind === 'fold') {
    if (d.angle >= CFG.FOLD_MIN_DEG) startFoldAnim(d.axis, d.angle);
    else if (d.angle > 1) startAbortAnim(d.axis, d.angle);
    else piece.preview = null;
    return;
  }

  if (d.kind === 'move' && piece.ready) {
    const center = { x: DESK.cx + piece.off.x, y: DESK.cy + piece.off.y };
    let si = slotAt(center);
    if (si < 0) si = slotAt(w);
    if (si >= 0) {
      if (!dropIntoSlot(si)) {
        piece.offAnim = { t:0, dur:0.22, from:{x:piece.off.x,y:piece.off.y}, to:{x:0,y:0} };
      }
    }
  }
}

canvas.addEventListener('pointerdown', e => {
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
  e.preventDefault();
  onDown(toWorld(e.clientX, e.clientY));
});
canvas.addEventListener('pointermove', e => {
  if (state.drag) e.preventDefault();
  onMove(toWorld(e.clientX, e.clientY));
});
canvas.addEventListener('pointerup', e => onUp(toWorld(e.clientX, e.clientY)));
canvas.addEventListener('pointercancel', e => onUp(toWorld(e.clientX, e.clientY)));
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'z') {
    e.preventDefault(); audioWake(); undo();
  }
});

// ------------------------------------------------------------- 按钮
document.getElementById('bUndo').addEventListener('click', () => { audioWake(); undo(); });
document.getElementById('bReset').addEventListener('click', () => { audioWake(); resetAll(); });
document.getElementById('bDemo').addEventListener('click', () => { audioWake(); startDemo(); });

function resetAll() {
  for (let i = 0; i < 6; i++) state.slots[i].items.length = 0;
  state.levelTimes.length = 0;
  state.firstFold = null; state.firstSlot = null;
  state.allDone = false; state.flying = null; state.demo = null;
  state.fx.length = 0; state.toast = null;
  state.t0 = nowMs();
  newLevel(0);
}

// ------------------------------------------------------------- 演示模式
function startDemo() {
  if (state.allDone || state.flying) return;
  state.demo = { phase:'wait', t:0 };
}

function demoUpdate(dt) {
  const D = state.demo;
  if (!D) return;
  D.t += dt;
  const piece = state.piece;
  if (!piece) return;

  if (D.phase === 'wait') {
    if (D.t < 0.16) return;
    D.t = 0;
    if (!piece.ready) {
      const sol = candidates(piece).find(c => c.sol);
      if (!sol) { state.demo = null; return; }
      D.phase = 'fold';
      D.axis = { type:sol.type, pos:sol.pos, side:sol.side, sol:true };
    } else {
      const si = (state.slots[SUGGESTED_SLOT].items.length < CFG.SLOT_CAP)
        ? SUGGESTED_SLOT : firstFreeSlot();
      if (si < 0) { state.demo = null; return; }
      D.slot = si;
      D.phase = 'drag';
      const r = SLOT_RECTS[si];
      D.target = { x: r.x + r.w / 2 - DESK.cx, y: r.y + r.h / 2 - DESK.cy };
      D.off0 = { x: piece.off.x, y: piece.off.y };
    }
  } else if (D.phase === 'fold') {
    const p = clamp(D.t / 0.5, 0, 1);
    const ang = 172 * easeOutCubic(p);
    piece.preview = { type:D.axis.type, pos:D.axis.pos, side:D.axis.side,
                      cos: Math.cos(ang * Math.PI / 180) };
    if (p >= 1) {
      piece.preview = null;
      commitFold(D.axis, true);
      D.phase = 'wait'; D.t = 0;
    }
  } else if (D.phase === 'drag') {
    const p = clamp(D.t / 0.55, 0, 1);
    const e = easeOutCubic(p);
    piece.off.x = lerp(D.off0.x, D.target.x, e);
    piece.off.y = lerp(D.off0.y, D.target.y, e);
    if (p >= 1) {
      if (!dropIntoSlot(D.slot)) { piece.off.x = 0; piece.off.y = 0; }
      D.phase = 'wait'; D.t = 0;
    }
  }
}

// ------------------------------------------------------------- 渲染
function drawBackdrop() {
  ctx.fillStyle = COL.page;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  ctx.save();
  ctx.shadowColor = 'rgba(58,55,51,0.10)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  ctx.fillStyle = COL.desk; rr(ctx, DESK.x, DESK.y, DESK.w, DESK.h, 18); ctx.fill();
  ctx.restore();

  ctx.save();
  rr(ctx, DESK.x, DESK.y, DESK.w, DESK.h, 18); ctx.clip();
  ctx.strokeStyle = 'rgba(58,55,51,0.035)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = DESK.x; x < DESK.x + DESK.w; x += 28) { ctx.moveTo(x, DESK.y); ctx.lineTo(x, DESK.y + DESK.h); }
  for (let y = DESK.y; y < DESK.y + DESK.h; y += 28) { ctx.moveTo(DESK.x, y); ctx.lineTo(DESK.x + DESK.w, y); }
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.shadowColor = 'rgba(58,55,51,0.10)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8;
  ctx.fillStyle = COL.drawer; rr(ctx, DRAWER.x, DRAWER.y, DRAWER.w, DRAWER.h, 18); ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(58,55,51,0.72)';
  ctx.font = '600 16px "Microsoft YaHei",system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('抽屉 · 6 格位', DRAWER.x + 20, DRAWER.y + 32);
  ctx.fillStyle = 'rgba(58,55,51,0.42)';
  ctx.font = '12px "Microsoft YaHei",system-ui,sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('一格 3 件', DRAWER.x + DRAWER.w - 20, DRAWER.y + 32);
  ctx.textAlign = 'left';
}

function drawSlots(now) {
  const readyPiece = !!(state.piece && state.piece.ready);
  // 建议格：优先 SUGGESTED_SLOT，满了就顺延到第一个还有空的
  let suggestIdx = -1;
  if (readyPiece) {
    if (state.slots[SUGGESTED_SLOT].items.length < CFG.SLOT_CAP) suggestIdx = SUGGESTED_SLOT;
    else {
      for (let i = 0; i < 6; i++) {
        if (state.slots[i].items.length < CFG.SLOT_CAP) { suggestIdx = i; break; }
      }
    }
  }
  for (let i = 0; i < 6; i++) {
    const r = SLOT_RECTS[i], slot = state.slots[i];
    const full = slot.items.length >= CFG.SLOT_CAP;
    const suggest = (i === suggestIdx);

    ctx.save();
    rr(ctx, r.x, r.y, r.w, r.h, 12);
    ctx.fillStyle = COL.slot; ctx.fill();
    if (suggest) {
      const pulse = 0.42 + 0.33 * Math.sin(now / 260);
      ctx.strokeStyle = 'rgba(180,85,60,' + pulse.toFixed(3) + ')';
      ctx.lineWidth = 2.5; ctx.stroke();
    } else {
      ctx.strokeStyle = COL.slotEdge; ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.save();
    rr(ctx, r.x, r.y, r.w, r.h, 12); ctx.clip();
    ctx.strokeStyle = 'rgba(58,55,51,0.05)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let k = 1; k < 3; k++) {
      const x = r.x + (r.w / 3) * k;
      ctx.moveTo(x, r.y + 12); ctx.lineTo(x, r.y + r.h - 26);
    }
    ctx.stroke();
    ctx.restore();
    ctx.restore();

    for (let k = 0; k < slot.items.length; k++) drawMiniCells(slot.items[k], r, k);

    const pipY = r.y + r.h - 15;
    for (let k = 0; k < CFG.SLOT_CAP; k++) {
      ctx.beginPath();
      ctx.arc(r.x + 14 + k * 13, pipY, 3.4, 0, Math.PI * 2);
      ctx.fillStyle = (k < slot.items.length) ? 'rgba(58,55,51,0.55)' : 'rgba(58,55,51,0.14)';
      ctx.fill();
    }
    if (full) {
      ctx.fillStyle = 'rgba(110,127,92,0.85)';
      ctx.font = '600 11px "Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('满', r.x + r.w - 14, pipY + 4);
      ctx.textAlign = 'left';
    }
  }
}

function drawMiniCells(item, r, stackIdx) {
  const bb = bboxOfCells(item.cells);
  const s = Math.min((r.w - 44) / Math.max(bb.w, 1e-6), (r.h - 66) / Math.max(bb.h, 1e-6));
  const cx = r.x + r.w / 2;
  const cy = r.y + (r.h - 26) / 2 - stackIdx * 6;

  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-bb.cx, -bb.cy);

  const list = item.cells.slice().sort((a, b) => a.z - b.z);
  for (let i = 0; i < list.length; i++) {
    const c = list[i];
    const col = ((c.flip % 2) === 1) ? mixRgb(item.rgb, [40,38,35], 0.22) : item.rgb;
    ctx.beginPath();
    ctx.moveTo(c.pts[0].x, c.pts[0].y);
    ctx.lineTo(c.pts[1].x, c.pts[1].y);
    ctx.lineTo(c.pts[2].x, c.pts[2].y);
    ctx.lineTo(c.pts[3].x, c.pts[3].y);
    ctx.closePath();
    ctx.fillStyle = rgba(col, 1); ctx.fill();
  }
  ctx.restore();
}

// 折中预览：绕轴镜像是 cosθ 的正交投影
function pvPoint(p, pv) {
  const d = (pv.type === 'v' ? (p.x - pv.pos) : (p.y - pv.pos)) * pv.side;
  if (d <= 1e-6) return p;
  const k = d * (1 - pv.cos) * pv.side;
  return (pv.type === 'v') ? { x: p.x - k, y: p.y } : { x: p.x, y: p.y - k };
}

function renderCells(cells, tx, rgbBase, preview, withShadow) {
  const n = cells.length;
  const geo = new Array(n);
  const moving = new Uint8Array(n);
  const order = new Array(n);

  for (let i = 0; i < n; i++) {
    const c = cells[i], p = c.pts;
    let mv = false;
    if (preview) {
      const cx = (p[0].x + p[1].x + p[2].x + p[3].x) / 4;
      const cy = (p[0].y + p[1].y + p[2].y + p[3].y) / 4;
      mv = ((preview.type === 'v' ? cx - preview.pos : cy - preview.pos) * preview.side) > 1e-6;
    }
    moving[i] = mv ? 1 : 0;
    const q = new Array(4);
    for (let k = 0; k < 4; k++) q[k] = tx(mv ? pvPoint(p[k], preview) : p[k]);
    geo[i] = q;
    order[i] = { i, key: c.z + (mv ? 5 : 0) + i * 1e-4 };
  }
  order.sort((a, b) => a.key - b.key);

  if (withShadow) {
    ctx.save();
    ctx.shadowColor = 'rgba(58,55,51,0.20)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 9;
    ctx.beginPath();
    for (let k = 0; k < n; k++) {
      const q = geo[k];
      ctx.moveTo(q[0].x, q[0].y); ctx.lineTo(q[1].x, q[1].y);
      ctx.lineTo(q[2].x, q[2].y); ctx.lineTo(q[3].x, q[3].y); ctx.closePath();
    }
    ctx.fillStyle = rgba(rgbBase, 1); ctx.fill();
    ctx.restore();
  }

  const gridPath = new Path2D();
  for (let k = 0; k < n; k++) {
    const idx = order[k].i, q = geo[idx], c = cells[idx];
    let col = rgbBase;
    if ((c.flip % 2) === 1) col = mixRgb(col, [40,38,35], 0.20);
    if (preview && moving[idx]) col = mixRgb(col, [40,38,35], 0.20 * (1 - preview.cos) / 2);
    const jit = 0.985 + ((idx * 37) % 7) * 0.005;

    ctx.beginPath();
    ctx.moveTo(q[0].x, q[0].y); ctx.lineTo(q[1].x, q[1].y);
    ctx.lineTo(q[2].x, q[2].y); ctx.lineTo(q[3].x, q[3].y); ctx.closePath();
    ctx.fillStyle = 'rgb(' + ((col[0]*jit)|0) + ',' + ((col[1]*jit)|0) + ',' + ((col[2]*jit)|0) + ')';
    ctx.fill();

    gridPath.moveTo(q[0].x, q[0].y); gridPath.lineTo(q[1].x, q[1].y);
    gridPath.lineTo(q[2].x, q[2].y); gridPath.lineTo(q[3].x, q[3].y); gridPath.closePath();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.055)'; ctx.lineWidth = 0.7; ctx.stroke(gridPath);
}

function drawCreases(piece, o) {
  for (let i = 0; i < piece.creases.length; i++) {
    const cr = piece.creases[i];
    const ax = o.x + cr.a.x * CFG.UNIT, ay = o.y + cr.a.y * CFG.UNIT;
    const bx = o.x + cr.b.x * CFG.UNIT, by = o.y + cr.b.y * CFG.UNIT;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(58,55,51,0.26)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,251,240,0.62)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }
}

function drawCandidates(piece, o, now) {
  if (piece.ready || piece.anim) return;
  const cs = candidates(piece), bb = bboxOfCells(piece.cells);

  for (let i = 0; i < cs.length; i++) {
    const a = cs[i], over = 16;
    let x0, y0, x1, y1;
    if (a.type === 'v') {
      const sx = o.x + a.pos * CFG.UNIT;
      x0 = x1 = sx;
      y0 = o.y + bb.y0 * CFG.UNIT - over; y1 = o.y + bb.y1 * CFG.UNIT + over;
    } else {
      const sy = o.y + a.pos * CFG.UNIT;
      y0 = y1 = sy;
      x0 = o.x + bb.x0 * CFG.UNIT - over; x1 = o.x + bb.x1 * CFG.UNIT + over;
    }

    if (a.sol) {
      const pulse = 0.55 + 0.33 * Math.sin(now / 320);
      ctx.save();
      ctx.setLineDash([11, 7]);
      ctx.lineDashOffset = -(now / 26) % 18;
      ctx.strokeStyle = 'rgba(180,85,60,' + pulse.toFixed(3) + ')';
      ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.restore();

      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
      const nx = a.type === 'v' ? a.side : 0;
      const ny = a.type === 'v' ? 0 : a.side;
      const px = -ny, py = nx;
      ctx.beginPath();
      ctx.moveTo(mx + nx * 9, my + ny * 9);
      ctx.lineTo(mx - nx * 5 + px * 8, my - ny * 5 + py * 8);
      ctx.lineTo(mx - nx * 5 - px * 8, my - ny * 5 - py * 8);
      ctx.closePath();
      ctx.fillStyle = 'rgba(180,85,60,0.8)'; ctx.fill();
    } else {
      ctx.save();
      ctx.setLineDash([4, 9]);
      ctx.strokeStyle = 'rgba(58,55,51,0.16)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawFx() {
  for (let i = state.fx.length - 1; i >= 0; i--) {
    const f = state.fx[i];
    const p = f.t / f.dur;
    if (p >= 1) { state.fx.splice(i, 1); continue; }
    if (!state.piece) { state.fx.splice(i, 1); continue; }

    const o = pieceOrigin(state.piece);
    const flash = Math.sin(Math.PI * p);
    const sx = o.x + f.x * CFG.UNIT, sy = o.y + f.y * CFG.UNIT;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const len = f.ext * CFG.UNIT * 0.5;
    ctx.strokeStyle = 'rgba(255,246,224,' + (0.75 * flash).toFixed(3) + ')';
    ctx.lineWidth = 2 + 5 * flash; ctx.lineCap = 'round';
    ctx.beginPath();
    if (f.axis.type === 'v') { ctx.moveTo(sx, sy - len); ctx.lineTo(sx, sy + len); }
    else                     { ctx.moveTo(sx - len, sy); ctx.lineTo(sx + len, sy); }
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(sx, sy, 6 + 34 * p, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,240,210,' + (0.5 * (1 - p)).toFixed(3) + ')';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
}

function drawFlying() {
  const f = state.flying;
  if (!f) return;
  const k = easeOutCubic(clamp(f.t / f.dur, 0, 1));
  const cx = lerp(f.from.x, f.to.x, k);
  const cy = lerp(f.from.y, f.to.y, k);
  const s = lerp(f.s0, f.s1, k);

  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-f.bbC.x, -f.bbC.y);
  renderCells(f.cells, p => p, f.rgb, null, false);
  for (let i = 0; i < f.creases.length; i++) {
    const cr = f.creases[i];
    ctx.strokeStyle = 'rgba(58,55,51,0.26)'; ctx.lineWidth = 0.05;
    ctx.beginPath(); ctx.moveTo(cr.a.x, cr.a.y); ctx.lineTo(cr.b.x, cr.b.y); ctx.stroke();
  }
  ctx.restore();
}

function drawDeskHeader(piece) {
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(58,55,51,0.78)';
  ctx.font = '600 17px "Microsoft YaHei",system-ui,sans-serif';
  ctx.fillText('第 ' + (state.levelIndex + 1) + ' / 3 件 · ' + LEVELS[state.levelIndex].name,
               DESK.x + 20, DESK.y + 34);

  const total = LEVELS[state.levelIndex].steps.length;
  const done = piece ? piece.stepIndex : total;
  ctx.font = '13px "Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(58,55,51,0.48)';
  ctx.fillText((piece && piece.ready) ? '折好了 · 拖进右边抽屉' : ('折 ' + done + ' / ' + total),
               DESK.x + 20, DESK.y + 56);

  for (let i = 0; i < total; i++) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(DESK.x + 20 + i * 14, DESK.y + 66, 9, 9, 2);
    else ctx.rect(DESK.x + 20 + i * 14, DESK.y + 66, 9, 9);
    ctx.fillStyle = (i < done) ? 'rgba(180,85,60,0.75)' : 'rgba(58,55,51,0.13)';
    ctx.fill();
  }
  ctx.restore();
}

function drawToastAdvance(dt) {
  const t = state.toast;
  if (!t) return;
  t.t += dt;
  if (t.t > t.dur) state.toast = null;
}

function drawToast() {
  const t = state.toast;
  if (!t) return;
  const a = t.t < 0.2 ? t.t / 0.2 : (t.t > t.dur - 0.4 ? (t.dur - t.t) / 0.4 : 1);

  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.font = '13px "Microsoft YaHei",system-ui,sans-serif';
  const w = ctx.measureText(t.msg).width + 28;
  const x = DESK.cx - w / 2;
  const y = DESK.y + DESK.h - 52;
  rr(ctx, x, y, w, 32, 9);
  ctx.fillStyle = 'rgba(58,55,51,0.86)'; ctx.fill();
  ctx.fillStyle = '#F7EFDF';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t.msg, DESK.cx, y + 17);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function drawDoneCard() {
  if (!state.allDone) return;
  ctx.save();
  ctx.fillStyle = 'rgba(58,55,51,0.06)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  const w = DONE_CARD.w, h = DONE_CARD.h;
  const x = DONE_CARD.x, y = DONE_CARD.y;
  ctx.shadowColor = 'rgba(58,55,51,0.18)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
  rr(ctx, x, y, w, h, 16);
  ctx.fillStyle = '#F7EFDF'; ctx.fill();
  ctx.shadowColor = 'transparent';

  ctx.textAlign = 'center';
  ctx.fillStyle = COL.ink;
  ctx.font = '600 20px "Microsoft YaHei",system-ui,sans-serif';
  ctx.fillText('三件都收好了', CFG.W / 2, y + 50);

  let total = 0;
  for (let i = 0; i < state.levelTimes.length; i++) total += state.levelTimes[i].ms;
  const line = state.levelTimes.map(t => t.id + ' ' + (t.ms / 1000).toFixed(1) + 's').join('    ');

  ctx.font = '13px "Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(58,55,51,0.55)';
  ctx.fillText(line, CFG.W / 2, y + 82);
  ctx.fillText('合计 ' + (total / 1000).toFixed(1) + 's · 一格 3 / 3 满', CFG.W / 2, y + 104);

  ctx.font = '600 13px "Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = COL.accent;
  ctx.fillText('点这里再收三件（抽屉不清空）', CFG.W / 2, y + 138);
  ctx.font = '12px "Microsoft YaHei",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(58,55,51,0.42)';
  ctx.fillText('或点右上「⟳ 重置」整轮重来', CFG.W / 2, y + 158);
  ctx.restore();
}

function updateTimerHud() {
  const el = document.getElementById('timer');
  const f = v => (v === null ? '—' : (v / 1000).toFixed(1) + 's');
  el.textContent = [
    'debug · 计时',
    't0→now      ' + ((nowMs() - state.t0) / 1000).toFixed(1) + 's',
    'first_fold  ' + f(state.firstFold),
    'first_slot  ' + f(state.firstSlot),
    'level       ' + (state.levelIndex + 1) + '/3'
  ].join('\n');
}

// ------------------------------------------------------------- 主循环
let lastT = 0;

function update(dt) {
  const piece = state.piece;

  if (piece && piece.anim) {
    const a = piece.anim;
    a.t += dt;
    const p = clamp(a.t / a.dur, 0, 1);
    const target = a.kind === 'fold' ? 180 : 0;
    const base = lerp(a.from, target, easeOutCubic(p));
    const bump = Math.sin(p * Math.PI) * (a.kind === 'fold' ? 3.2 : 0);
    const ang = base + bump;
    piece.preview = { type:a.axis.type, pos:a.axis.pos, side:a.axis.side,
                      cos: Math.cos(ang * Math.PI / 180) };
    if (p >= 1) {
      piece.preview = null;
      piece.anim = null;
      if (a.kind === 'fold') commitFold(a.axis, !!a.axis.sol);
    }
  }

  if (piece && piece.offAnim) {
    const o = piece.offAnim;
    o.t += dt;
    const p = clamp(o.t / o.dur, 0, 1), e = easeOutCubic(p);
    const tx = o.to ? o.to.x : 0, ty = o.to ? o.to.y : 0;
    piece.off.x = lerp(o.from.x, tx, e);
    piece.off.y = lerp(o.from.y, ty, e);
    if (p >= 1) piece.offAnim = null;
  }

  if (state.flying) {
    state.flying.t += dt;
    if (state.flying.t >= state.flying.dur) finishFly();
  }

  if (state.demo) demoUpdate(dt);

  for (let i = 0; i < state.fx.length; i++) state.fx[i].t += dt;

  drawToastAdvance(dt);
}

function render(now) {
  const dpr = view.dpr, s = view.scale;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * view.ox, dpr * view.oy);

  drawBackdrop();
  drawSlots(now);

  const p2 = state.piece;
  if (p2) {
    const o = pieceOrigin(p2);
    renderCells(p2.cells, q => ({ x: o.x + q.x * CFG.UNIT, y: o.y + q.y * CFG.UNIT }),
                p2.rgb, p2.preview, true);
    drawCreases(p2, o);
    drawCandidates(p2, o, now);
    drawDeskHeader(p2);
  } else {
    drawDeskHeader(null);
  }

  drawFx();
  drawFlying();
  drawToast();
  drawDoneCard();
  updateTimerHud();
}

function frame() {
  const now = nowMs();                 // 用 performance.now 算 dt：rAF 时间戳在部分环境不推进
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  update(clamp(dt, 0, 0.05));
  render(now);
  requestAnimationFrame(frame);
}

function boot() {
  resize();
  newLevel(0);
  state.t0 = nowMs();
  lastT = 0;
  requestAnimationFrame(frame);

  // 首帧后轻提示，保证 10 秒内能完成第一折
  setTimeout(() => {
    if (state.firstFold === null && !state.allDone) toast('按住衣服 · 往虚线那边拖 · 松手');
  }, 900);

  // 埋点出口（Console / 录屏核对用）
  window.__fold = {
    telemetry: () => ({
      t0: state.t0,
      first_fold_ms: state.firstFold,
      first_slot_ms: state.firstSlot,
      levels: state.levelTimes.map(t => ({ id: t.id, ms: Math.round(t.ms), slot: t.slot })),
      slots: state.slots.map(s => s.items.length)
    }),
    press: (x, y) => onDown({ x, y }),
    move:  (x, y) => onMove({ x, y }),
    release: (x, y) => onUp({ x, y }),
    demo:  () => startDemo(),
    // 确定性推进（自动化/录屏脚本用）：不依赖 rAF
    tick: (ms) => { update((ms || 16.7) / 1000); render(nowMs()); },
    debug: () => ({
      level: state.levelIndex,
      step: state.piece ? state.piece.stepIndex : -1,
      ready: !!(state.piece && state.piece.ready),
      creases: state.piece ? state.piece.creases.length : 0,
      marks: state.piece ? state.piece.marks.slice() : [],
      allDone: state.allDone,
      demo: state.demo ? state.demo.phase : null
    })
  };
}

boot();

})();
</script>
</body>
</html>
