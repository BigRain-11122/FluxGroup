    text: 内容算术两版互斥（42min vs 127min），都未实测；这直接决定 $14.99 的退款风险。
  - id: F3
    severity: 高
    text: G-A 硬条件「主源持续 7 天」未满足，只有单日快照。
  - id: F4
    severity: 中
    text: 契约 scene 仍写「折纸/折布」，与已 PIVOT 的折衣产品叙述不一致（C-14 应由制作人升版）。
  - id: F5
    severity: 中
    text: 8 闸全 NOT_RUN/FAIL，G-B 只能证明几何与判定，不能证明交付。
  - id: F6
    severity: 中
    text: 单位经济脚本默认假设比宪法乐观 42%（已修为 C-12 口径并加自检）。
  - id: F7
    severity: 信息
    text: 可玩 demo 已立（Windows exe）：6/6 件自动通关、每件 IoU=1.000、数据驱动 100 件。三个玩法级 bug 在打通时修掉。仍未验：人类盲看、人类耗时、1080p 帧率（自动化会话无渲染设备）。

