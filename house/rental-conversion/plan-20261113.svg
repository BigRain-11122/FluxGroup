<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1240" width="900" height="1240" font-family="Microsoft YaHei, Noto Sans SC, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/>
    </marker>
    <marker id="arn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#1f6fb2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1240" fill="#faf8f4"/>

  <text x="60" y="42" font-size="22" font-weight="700" fill="#222">一套改两套 · 户型判定与三居室合租方案</text>
  <text x="60" y="66" font-size="13" fill="#666">示意平面（按挂牌标注面积与比例绘制，非施工图）｜房间长宽误差 ±0.3m，动工前必须现场实测</text>

  <!-- ===== 平面底板 ===== -->
  <rect x="110" y="90" width="571" height="612" fill="#fffdf9" stroke="none"/>

  <!-- 房间底色 -->
  <rect x="110" y="90" width="211" height="184" fill="#fff6e6"/>
  <rect x="321" y="90" width="143" height="170" fill="#eef5ff"/>
  <rect x="464" y="90" width="142" height="170" fill="#fdf3e4"/>
  <rect x="606" y="90" width="75" height="170" fill="#f2f2f2"/>
  <rect x="538" y="260" width="143" height="129" fill="#e9f7f3"/>
  <rect x="464" y="260" width="74" height="129" fill="#f7f7f7"/>
  <rect x="110" y="274" width="354" height="129" fill="#eef5ff"/>
  <rect x="110" y="403" width="286" height="163" fill="#fff6e6"/>
  <rect x="110" y="566" width="286" height="102" fill="#f0f7e6"/>
  <rect x="396" y="403" width="68" height="265" fill="#f7f7f7"/>
  <rect x="538" y="389" width="143" height="123" fill="#e9f7f3"/>
  <rect x="464" y="512" width="217" height="190" fill="#fff6e6"/>
  <rect x="464" y="403" width="74" height="109" fill="#fff6e6"/>

  <!-- 外墙 -->
  <rect x="110" y="90" width="571" height="612" fill="none" stroke="#2a2a2a" stroke-width="7"/>

  <!-- 原内墙 -->
  <g stroke="#4a4a4a" stroke-width="4" fill="none">
    <line x1="321" y1="90" x2="321" y2="274"/>
    <line x1="110" y1="274" x2="321" y2="274"/>
    <line x1="321" y1="260" x2="464" y2="260"/>
    <line x1="464" y1="90" x2="464" y2="260"/>
    <line x1="464" y1="260" x2="681" y2="260"/>
    <line x1="538" y1="260" x2="538" y2="389"/>
    <line x1="538" y1="389" x2="681" y2="389"/>
    <line x1="464" y1="260" x2="464" y2="702"/>
    <line x1="606" y1="90" x2="606" y2="260"/>
    <line x1="110" y1="566" x2="396" y2="566"/>
  </g>

  <!-- 新增墙（红） -->
  <g stroke="#c0392b" stroke-width="5" fill="none">
    <line x1="110" y1="403" x2="396" y2="403"/>
    <line x1="396" y1="403" x2="396" y2="668"/>
    <line x1="538" y1="389" x2="538" y2="512"/>
    <line x1="538" y1="512" x2="681" y2="512"/>
  </g>

  <!-- 窗（蓝） -->
  <g stroke="#1f6fb2" stroke-width="9" stroke-linecap="butt">
    <line x1="150" y1="90" x2="262" y2="90"/>
    <line x1="490" y1="90" x2="600" y2="90"/>
    <line x1="681" y1="292" x2="681" y2="368"/>
    <line x1="681" y1="612" x2="681" y2="690"/>
    <line x1="132" y1="702" x2="378" y2="702"/>
  </g>

  <!-- 门（弧） -->
  <g stroke="#8a8a8a" stroke-width="2.5" fill="none">
    <path d="M341,90 L341,144 A54,54 0 0,0 395,90"/>
    <path d="M321,200 L375,200 A55,55 0 0,0 321,255"/>
    <path d="M490,260 L490,306 A46,46 0 0,0 536,260"/>
    <path d="M538,300 L592,300 A55,55 0 0,0 538,355"/>
    <path d="M150,403 L150,451 A48,48 0 0,1 198,403"/>
    <path d="M464,600 L412,600 A52,52 0 0,0 464,652"/>
    <path d="M538,430 L592,430 A55,55 0 0,0 538,485"/>
    <path d="M150,566 L214,566"/>
    <path d="M266,566 L330,566"/>
  </g>

  <!-- 立管 + 借管路径 -->
  <circle cx="648" cy="300" r="8" fill="#f1c40f" stroke="#8a6d00" stroke-width="2"/>
  <line x1="648" y1="308" x2="648" y2="430" stroke="#e67e22" stroke-width="3" stroke-dasharray="7,5"/>
  <circle cx="648" cy="438" r="6" fill="#e67e22"/>

  <!-- 房间标注 -->
  <g font-size="13" fill="#222">
    <text x="152" y="150" font-weight="700">卧室A</text>
    <text x="152" y="168" font-size="11" fill="#555">8.4㎡ · 北窗</text>
    <text x="152" y="184" font-size="11" fill="#555">租金系数 0.55R</text>

    <text x="350" y="150" font-weight="700">餐厅</text>
    <text x="350" y="166" font-size="11" fill="#555">共享</text>

    <text x="478" y="150" font-weight="700">厨房</text>
    <text x="478" y="166" font-size="11" fill="#555">5.1㎡ · 北窗 · 明厨</text>

    <text x="618" y="150" font-size="11" fill="#777">设备平台</text>
    <text x="618" y="164" font-size="10" fill="#999">待核实</text>

    <text x="558" y="110" font-size="0" >.</text>
    <text x="548" y="316" font-weight="700">卫1</text>
    <text x="548" y="332" font-size="11" fill="#555">3.9㎡ · 东窗</text>
    <text x="548" y="347" font-size="11" fill="#555">明卫</text>

    <text x="470" y="330" font-size="11" fill="#777">走道</text>

    <text x="180" y="320" font-weight="700">共享客厅 / 餐厅</text>
    <text x="180" y="338" font-size="11" fill="#555">约 14㎡ · 暗厅（家具分区，不砌墙）</text>

    <text x="152" y="446" font-weight="700">卧室C（新隔断）</text>
    <text x="152" y="464" font-size="11" fill="#555">约 10.1㎡ + 阳台 5.3㎡</text>
    <text x="152" y="480" font-size="11" fill="#555">南向借光 · 系数 0.80R</text>

    <text x="152" y="612" font-weight="700">阳台 5.3㎡</text>
    <text x="152" y="630" font-size="11" fill="#555">并入卧室C · 南向落地窗</text>

    <text x="404" y="500" font-size="11" fill="#777" transform="rotate(90 404 500)">走廊 1.0m</text>

    <text x="548" y="436" font-weight="700">卫2（新建）</text>
    <text x="548" y="452" font-size="11" fill="#555">3.8㎡ · 背靠背借管</text>
    <text x="548" y="467" font-size="11" fill="#555">暗卫 · 强排 + 玻璃砖借光</text>

    <text x="480" y="596" font-weight="700">卧室B（主卧套）</text>
    <text x="480" y="614" font-size="11" fill="#555">10.9㎡ + 独卫 3.8㎡</text>
    <text x="480" y="630" font-size="11" fill="#555">东窗 · 系数 0.85R</text>
  </g>

  <!-- 指引 -->
  <g stroke="#1f6fb2" stroke-width="1.5" fill="none" marker-end="url(#arn)">
    <path d="M648,368 L648,398"/>
  </g>
  <text x="662" y="392" font-size="10" fill="#1f6fb2">新卫直落原立管，横管 0m</text>

  <!-- 北向 -->
  <g transform="translate(700,660)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#999"/>
    <path d="M0,-14 L7,8 L0,3 L-7,8 z" fill="#c0392b"/>
    <text x="-4" y="32" font-size="11" fill="#666">N</text>
  </g>

  <!-- ===== 右栏：说明 ===== -->
  <g font-size="12" fill="#333">
    <text x="720" y="120" font-size="15" font-weight="700" fill="#c0392b">为什么不做“两套”</text>
    <text x="720" y="146">全明需要 8 个采光面：</text>
    <text x="720" y="164">卧×2、厅×2、厨×2、卫×2。</text>
    <text x="720" y="182">本户实际只有 5 个：</text>
    <text x="720" y="200">北2（卧室A、厨房）、</text>
    <text x="720" y="218">东2（卫1、卧室B）、</text>
    <text x="720" y="236">南1（阳台）。</text>
    <text x="720" y="262" font-weight="700">8 &gt; 5，算术上不够。</text>
    <text x="720" y="288">再叠加两道死结：</text>
    <text x="720" y="308">① 入户门只在北墙中部，</text>
    <text x="720" y="326">   东/南均为外墙，</text>
    <text x="720" y="344">   没有第二户门的位置；</text>
    <text x="720" y="364">② 排污立管只有东侧一根，</text>
    <text x="720" y="382">   西套新卫没有可接的立管。</text>
    <text x="720" y="410" font-weight="700" fill="#1f6fb2">三居室合租反而“全明”</text>
    <text x="720" y="432">3 间卧室全部有外墙窗，</text>
    <text x="720" y="450">原厨、原卫各有一扇窗。</text>

    <text x="720" y="492" font-size="13" font-weight="700">图例</text>
    <rect x="720" y="504" width="26" height="10" fill="none" stroke="#2a2a2a" stroke-width="5"/>
    <text x="754" y="514">外墙 / 承重（不可动）</text>
    <rect x="720" y="526" width="26" height="10" fill="none" stroke="#4a4a4a" stroke-width="3"/>
    <text x="754" y="536">原内墙（视结构）</text>
    <rect x="720" y="548" width="26" height="10" fill="none" stroke="#c0392b" stroke-width="4"/>
    <text x="754" y="558">新增轻钢龙骨墙</text>
    <rect x="720" y="570" width="26" height="6" fill="#1f6fb2"/>
    <text x="754" y="578">窗 / 采光面</text>
    <circle cx="733" cy="596" r="6" fill="#f1c40f" stroke="#8a6d00"/>
    <text x="754" y="600">排污立管（仅 1 根）</text>
    <line x1="720" y1="618" x2="746" y2="618" stroke="#e67e22" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="754" y="622">新增排水路径</text>
  </g>

  <!-- ===== 下方：两套切法示意 ===== -->
  <line x1="60" y1="760" x2="860" y2="760" stroke="#ddd"/>
  <text x="60" y="792" font-size="16" font-weight="700" fill="#222">附：两套切法（N-S 切）为什么撑不住</text>

  <g transform="translate(60,812) scale(0.6)">
    <rect x="110" y="90" width="571" height="612" fill="#fffdf9"/>
    <rect x="110" y="90" width="571" height="314" fill="#e8f1fb"/>
    <rect x="110" y="404" width="571" height="298" fill="#fdeee2"/>
    <rect x="110" y="90" width="571" height="612" fill="none" stroke="#2a2a2a" stroke-width="6"/>
    <g stroke="#666" stroke-width="3.5" fill="none">
      <line x1="321" y1="90" x2="321" y2="274"/>
      <line x1="110" y1="274" x2="321" y2="274"/>
      <line x1="321" y1="260" x2="464" y2="260"/>
      <line x1="464" y1="90" x2="464" y2="260"/>
      <line x1="464" y1="260" x2="681" y2="260"/>
      <line x1="538" y1="260" x2="538" y2="389"/>
      <line x1="538" y1="389" x2="681" y2="389"/>
      <line x1="464" y1="260" x2="464" y2="702"/>
      <line x1="110" y1="566" x2="396" y2="566"/>
    </g>
    <line x1="110" y1="404" x2="681" y2="404" stroke="#c0392b" stroke-width="9" stroke-dasharray="22,12"/>
    <g stroke="#1f6fb2" stroke-width="8">
      <line x1="150" y1="90" x2="262" y2="90"/>
      <line x1="490" y1="90" x2="600" y2="90"/>
      <line x1="681" y1="292" x2="681" y2="368"/>
      <line x1="681" y1="612" x2="681" y2="690"/>
      <line x1="132" y1="702" x2="378" y2="702"/>
    </g>
    <text x="130" y="140" font-size="26" font-weight="700" fill="#1f6fb2">北套</text>
    <text x="130" y="172" font-size="18" fill="#3a6ea5">卧明·厨明·卫明</text>
    <text x="130" y="196" font-size="18" fill="#3a6ea5">厅借光</text>
    <text x="130" y="480" font-size="26" font-weight="700" fill="#c0692b">南套</text>
    <text x="130" y="512" font-size="18" fill="#a05a26">卧明·厅明</text>
    <text x="130" y="536" font-size="18" fill="#a05a26">厨暗·卫暗</text>
  </g>

  <g font-size="12" fill="#c0392b">
    <text x="500" y="860" font-weight="700">三道过不去的坎</text>
    <text x="500" y="882">1. 南套没有独立入户门。</text>
    <text x="510" y="900" fill="#555">入户门只在北墙中部，南套要么穿北套，</text>
    <text x="510" y="916" fill="#555">要么沿东侧拉一条 1.0m 通道——</text>
    <text x="510" y="932" fill="#555">而东侧正是唯一的两扇东窗。</text>
    <text x="500" y="958">2. 通道会吃 6㎡ 且遮掉卧室B 的东窗。</text>
    <text x="500" y="984">3. 南套新卫只能背靠背借管（可行），</text>
    <text x="510" y="1000" fill="#555">但新厨无外墙，只能做暗厨 + 强制排风。</text>
    <text x="500" y="1026" font-weight="700">结论：能做，但产品只剩 1.7–1.85R，</text>
    <text x="510" y="1044" fill="#555">改造 20 万，回收 20 年以上，不成立。</text>
  </g>

  <g font-size="11" fill="#888">
    <text x="60" y="1210">数据来源：2026-11-13 21:40 房源详情页户型图（卧室A 8.4 / 厨房 5.1 / 卫生间 3.9 / 卧室B 15.8 / 客厅 23.6 / 阳台 5.3 ㎡）；尺寸链 上 3109·2082·2072·1098 / 下 1849·683·1903·833·614·2599 / 右 1869·242·5962。</text>
    <text x="60" y="1228">图中长宽为按面积与比例反推的示意值，与真实墙位存在偏差；拆改前必须取得竣工图并现场复尺，外墙与承重墙一律不得开洞、不得开槽。</text>
  </g>
</svg>
