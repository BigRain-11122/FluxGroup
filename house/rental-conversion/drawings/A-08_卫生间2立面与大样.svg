idth="0.60" stroke-linecap="butt" opacity="1"/><line x1="697.20" y1="222.00" x2="697.20" y2="366.00" stroke="#9ec9e6" stroke-width="0.60" stroke-linecap="butt" opacity="1"/><line x1="720.00" y1="222.00" x2="720.00" y2="366.00" stroke="#9ec9e6" stroke-width="0.60" stroke-linecap="butt" opacity="1"/><line x1="606.00" y1="244.80" x2="726.00" y2="244.80" stroke="#9ec9e6" stroke-width="0.60" stroke-linecap="butt" opacity="1"/><line x1="606.00" y1="267.60" x2="726.00" y2="267.60" stroke="#9ec9e6" stroke-width="0.60" stroke-linecap="butt" opacity="1"/><line x1="606.00" y1="290.40" x2="726.00" y2="290.40" stroke="#9ec9e6" stroke-width="0.60" stroke-linecap="butt" opacity="1"/><line x1="606.00" y1="313.20" x2="726.00" y2="313.20" stroke="#9ec9e6" stroke-width="0.60" stroke-linecap="butt" opacity="1"/><line x1="606.00" y1="336.00" x2="726.00" y2="336.00" stroke="#9ec9e6" stroke-width="0.60" stroke-linecap="butt" opacity="1"/><line x1="606.00" y1="358.80" x2="726.00" y2="358.80" stroke="#9ec9e6" stroke-width="0.60" stroke-linecap="butt" opacity="1"/><text x="666.00" y="375.60" font-size="5.25" text-anchor="middle" font-weight="normal" opacity="1" fill="#1f6fb2">玻璃砖 190×190（1000×1200）</text><text x="666.00" y="385.20" font-size="5.10" text-anchor="middle" font-weight="normal" opacity="1" fill="#565656">借主卧东窗光 · 非外墙开洞</text><rect x="565.20" y="186.00" width="31.20" height="168.00" fill="#f4f8fb" stroke="#b9c7d2" stroke-width="0.90" stroke-dasharray="4,2" opacity="1" rx="0.00"/><text x="580.80" y="264.00" font-size="5.10" text-anchor="middle" font-weight="normal" opacity="1" transform="rotate(90 580.80 264.00)" fill="#565656">淋浴位</text><text x="562.32" y="113.04" font-size="6.60" text-anchor="middle" font-weight="normal" opacity="1" fill="#565656">东墙立面 1800</text><rect x="78.00" y="588.00" width="20.00" height="200.00" fill="url(#h45)" stroke="#1c1c1c" stroke-width="1.20" opacity="1" rx="0.00"/><rect x="98.00" y="671.33" width="33.33" height="100.00" fill="#eef0f2" stroke="#1c1c1c" stroke-width="1.20" opacity="1" rx="0.00"/><text x="114.67" y="724.67" font-size="5.10" text-anchor="middle" font-weight="normal" opacity="1" transform="rotate(90 114.67 724.67)" fill="#565656">隐藏水箱</text><line x1="98.00" y1="681.33" x2="78.00" y2="681.33" stroke="#1c1c1c" stroke-width="2.40" stroke-linecap="butt" opacity="1"/><line x1="98.00" y1="761.33" x2="78.00" y2="761.33" stroke="#1c1c1c" stroke-width="2.40" stroke-linecap="butt" opacity="1"/><rect x="78.00" y="788.00" width="233.33" height="13.33" fill="url(#grain)" stroke="#1c1c1c" stroke-width="1.20" opacity="1" rx="0.00"/><text x="194.67" y="809.67" font-size="5.70" text-anchor="middle" font-weight="normal" opacity="1" fill="#565656">结构楼板（不得开洞）</text><line x1="149.67" y1="604.67" x2="149.67" y2="788.00" stroke="#1c1c1c" stroke-width="6.00" stroke-linecap="butt" opacity="1"/><text x="156.33" y="641.33" font-size="5.40" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">DN110 立管</text><line x1="131.33" y1="771.33" x2="149.67" y2="771.33" stroke="#1c1c1c" stroke-width="4.20" stroke-linecap="butt" opacity="1"/><text x="111.33" y="784.67" font-size="5.10" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">DN110 横管 0m · i=1.5%</text><line x1="98.00" y1="824.67" x2="149.67" y2="824.67" stroke="#565656" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="123.83" y="834.67" font-size="5.10" text-anchor="middle" font-weight="normal" opacity="1" fill="#565656">≥300 墙排净距</text><text x="816.00" y="114.00" font-size="9.00" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">卫2 做法说明</text><text x="816.00" y="141.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">1. 卫2 为暗卫：无外墙窗，机械排风 + 玻璃砖借光。</text><text x="816.00" y="156.30" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">2. 东墙内侧 1000×1200 做玻璃砖（190×190），</text><text x="816.00" y="171.60" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">   借主卧东窗漫射光；仅内隔，不得外墙开洞。</text><text x="816.00" y="186.90" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">3. 墙排马桶：隐藏水箱嵌入 200 厚砌体墙，</text><text x="816.00" y="202.20" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">   排水横管 0m 直落原 DN110 立管，不抬地坪。</text><text x="816.00" y="217.50" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">4. 地面 1.5% 坡向地漏，防水上返 1800，闭水 48h。</text><text x="816.00" y="232.80" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">5. 排风 Φ100 经吊顶接东外墙百叶，≥120m³/h，</text><text x="816.00" y="248.10" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">   延时开关 5 分钟。</text><text x="816.00" y="263.40" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">6. 吊顶铝扣板 300×300，H=2400，检修口对水箱。</text><text x="816.00" y="324.00" font-size="8.70" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">材料</text><text x="816.00" y="348.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">墙砖 300×600 哑光浅灰，竖贴</text><text x="816.00" y="363.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">地砖 300×300 防滑深灰</text><text x="816.00" y="378.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">吊顶 铝扣板 300×300 白色</text><text x="816.00" y="393.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">五金 黑色哑光（龙头/花洒/挂钩）</text><text x="816.00" y="408.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">玻璃砖 190×190 透明</text><text x="816.00" y="450.00" font-size="8.70" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">节点要点</text><text x="816.00" y="474.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">· 水箱支架固定于结构墙，不得固定于</text><text x="816.00" y="489.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">  轻钢龙骨墙；</text><text x="816.00" y="504.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">· 墙排管 DN110，接立管用异径三通 + 45° 弯；</text><text x="816.00" y="519.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">· 水箱检修口 400×400，与吊顶检修口对齐；</text><text x="816.00" y="534.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">· 坐便器完成面距地 1050。</text><line x1="816.00" y1="588.00" x2="1224.00" y2="588.00" stroke="#e6e6e6" stroke-width="0.90" stroke-linecap="butt" opacity="1"/><text x="816.00" y="612.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#c0392b">注：立面瓷砖排版按 300 竖缝、600 横缝；</text><text x="816.00" y="633.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#c0392b">实际排砖以现场尺寸为准，避免出现小于 150 的碎砖。</text></svg>