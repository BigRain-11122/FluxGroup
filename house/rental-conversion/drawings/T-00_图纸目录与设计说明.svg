><text x="102.00" y="411.00" font-size="8.10" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">给排水点位图</text><text x="330.00" y="411.00" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">1:50</text><line x1="54.00" y1="437.40" x2="414.00" y2="437.40" stroke="#eeeeee" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="430.20" font-size="8.10" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">A-08</text><text x="102.00" y="430.20" font-size="8.10" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">卫生间2 立面与大样</text><text x="330.00" y="430.20" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">1:25 / 1:10</text><line x1="54.00" y1="456.60" x2="414.00" y2="456.60" stroke="#eeeeee" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="449.40" font-size="8.10" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">D-01</text><text x="102.00" y="449.40" font-size="8.10" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">软装布置图</text><text x="330.00" y="449.40" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">1:50</text><line x1="54.00" y1="475.80" x2="414.00" y2="475.80" stroke="#eeeeee" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="468.60" font-size="8.10" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">D-02</text><text x="102.00" y="468.60" font-size="8.10" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">软装材料板与家具清单</text><text x="330.00" y="468.60" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">—</text><line x1="54.00" y1="495.00" x2="414.00" y2="495.00" stroke="#eeeeee" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="487.80" font-size="8.10" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">D-03</text><text x="102.00" y="487.80" font-size="8.10" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">产品配置标准与成本卡</text><text x="330.00" y="487.80" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">—</text><text x="54.00" y="522.00" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">页签：本册共 12 张（含封面），图纸编号与文件名一一对应。</text><text x="696.00" y="66.00" font-size="10.20" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">三、设计依据</text><text x="696.00" y="93.00" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">1. 《住房租赁条例》国令812号（2025-09-15 施行）</text><text x="696.00" y="107.40" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">2. 《苏州市出租房屋居住安全管理条例》§11–12</text><text x="696.00" y="121.80" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">3. GB 50096《住宅设计规范》</text><text x="696.00" y="136.20" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">4. GB 50015《建筑给水排水设计标准》</text><text x="696.00" y="150.60" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">5. JGJ 298《住宅室内防水工程技术规范》</text><text x="696.00" y="165.00" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">6. GB 50118《民用建筑隔声设计规范》</text><text x="696.00" y="179.40" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">7. GB 50016《建筑设计防火规范》</text><text x="696.00" y="193.80" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">8. GB 55009《燃气工程项目规范》</text><text x="696.00" y="234.00" font-size="10.20" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">四、主要材料做法</text><text x="696.00" y="258.00" font-size="7.35" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">隔墙</text><text x="738.00" y="258.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">75 系列轻钢龙骨 + 双面双层 12mm 纸面石膏板 + </text><text x="738.00" y="270.60" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">50mm 岩棉(≥80kg/m³)，Rw≥45dB</text><text x="696.00" y="295.50" font-size="7.35" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">楼地面</text><text x="738.00" y="295.50" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">卧室/厅：8mm SPC 锁扣地板；厨卫：300×300 防</text><text x="738.00" y="308.10" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">滑地砖；阳台：防滑地砖</text><text x="696.00" y="333.00" font-size="7.35" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">墙面</text><text x="738.00" y="333.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">居室：耐水腻子 + 哑光乳胶漆（可擦洗）；厨卫：300×60</text><text x="738.00" y="345.60" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">0 墙砖到顶</text><text x="696.00" y="370.50" font-size="7.35" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">顶面</text><text x="738.00" y="370.50" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">居室：原结构顶 + 局部吊顶；厨卫：300×300 铝扣板，</text><text x="738.00" y="383.10" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">H=2400</text><text x="696.00" y="408.00" font-size="7.35" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">门</text><text x="738.00" y="408.00" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">户门保留；室内门 800/900×2100 免漆复合门；卫2</text><text x="738.00" y="420.60" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656"> 门 800 铝镁合金</text><text x="696.00" y="445.50" font-size="7.35" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">五金</text><text x="738.00" y="445.50" font-size="6.75" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">壁挂马桶隐藏水箱、恒温花洒、静音地漏、防臭存水弯</text><text x="696.00" y="510.00" font-size="10.20" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">五、施工注意事项</text><text x="696.00" y="537.00" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">1. 拆改前取得竣工图与物业结构确认；粗黑实线一律按承重墙处理。</text><text x="696.00" y="550.80" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">2. 新增卫生间必须与原卫生间背靠背，横管≤1.5m，坡度 1.5%–2%。</text><text x="696.00" y="564.60" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">3. 不得新增排污立管、不得在梁下穿孔、不得改动燃气任何部件。</text><text x="696.00" y="578.40" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">4. 防水：地面 + 墙面 1.8m，两遍，闭水 48 小时并留存影像。</text><text x="696.00" y="592.20" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">5. 隔墙内预埋 40mm 线管；下水管包 2mm 隔音棉 + 阻尼片。</text><text x="696.00" y="606.00" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">6. 公共烟道不得封堵、不得改向；第二厨房不得接入。</text><text x="696.00" y="619.80" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">7. 疏散通道净宽≥1.1m，不得上锁堆物；每间配烟感与灭火器。</text><text x="696.00" y="633.60" font-size="6.90" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">8. 完工后按《住房租赁条例》实名签约并办理租赁备案。</text><line x1="696.00" y1="684.00" x2="1191.00" y2="684.00" stroke="#e6e6e6" stroke-width="0.90" stroke-linecap="butt" opacity="1"/><text x="696.00" y="705.00" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#c0392b">本册为方案深化图：几何依据挂牌户型图反推，未经现场复尺。</text><text x="696.00" y="723.00" font-size="7.20" text-anchor="start" font-weight="normal" opacity="1" fill="#c0392b">承重墙位置、立管管径、门洞尺寸、卧室B 南墙有无窗——四项核实后方可出施工图。</text></svg>