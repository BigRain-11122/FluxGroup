t><line x1="54.00" y1="100.80" x2="624.00" y2="100.80" stroke="#e6e6e6" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="114.60" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">原始格局</text><text x="132.00" y="114.60" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">卧室A 8.4 ｜ 厨房 5.1 ｜ 卫生间 3.9 ｜ 卧室B 15.8 ｜ 客厅 23.6 ｜ 阳台 5.3</text><line x1="54.00" y1="122.40" x2="624.00" y2="122.40" stroke="#e6e6e6" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="136.20" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">采光面</text><text x="132.00" y="136.20" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">北 2（卧室A、厨房）· 东 2（卫1、卧室B）· 南 1（阳台）· 西 0</text><line x1="54.00" y1="144.00" x2="624.00" y2="144.00" stroke="#e6e6e6" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="157.80" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">改造目标</text><text x="132.00" y="157.80" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">由"整租两室"升级为"三居室合租 + 新增独立卫生间"</text><line x1="54.00" y1="165.60" x2="624.00" y2="165.60" stroke="#e6e6e6" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="179.40" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">改造量</text><text x="132.00" y="179.40" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">新增轻钢龙骨隔墙 4 道（W1–W4）· 新增卫生间 1 间 · 室内窗 1 樘 · 不拆墙体</text><line x1="54.00" y1="187.20" x2="624.00" y2="187.20" stroke="#e6e6e6" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="201.00" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">不动作项</text><text x="132.00" y="201.00" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">承重墙、外墙立面、燃气管道与表具、公共烟道、排污立管、疏散通道</text><line x1="54.00" y1="208.80" x2="624.00" y2="208.80" stroke="#e6e6e6" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="252.60" font-size="10.20" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">二、图纸目录</text><line x1="54.00" y1="283.80" x2="414.00" y2="283.80" stroke="#eeeeee" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="276.60" font-size="8.10" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">T-00</text><text x="102.00" y="276.60" font-size="8.10" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">图纸目录与设计说明</text><text x="330.00" y="276.60" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">—</text><line x1="54.00" y1="303.00" x2="414.00" y2="303.00" stroke="#eeeeee" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="295.80" font-size="8.10" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">A-01</text><text x="102.00" y="295.80" font-size="8.10" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">原始结构图</text><text x="330.00" y="295.80" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">1:50</text><line x1="54.00" y1="322.20" x2="414.00" y2="322.20" stroke="#eeeeee" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="315.00" font-size="8.10" text-anchor="start" font-weight="bold" opacity="1" fill="#1c1c1c">A-02</text><text x="102.00" y="315.00" font-size="8.10" text-anchor="start" font-weight="normal" opacity="1" fill="#1c1c1c">墙体拆改图</text><text x="330.00" y="315.00" font-size="7.80" text-anchor="start" font-weight="normal" opacity="1" fill="#565656">1:50</text><line x1="54.00" y1="341.40" x2="414.00" y2="341.40" stroke="#eeeeee" stroke-width="0.75" stroke-linecap="butt" opacity="1"/><text x="54.00" y="334.20" font-size="8.10" text-anchor="start" font-weight="bold" opacity="1" fill="