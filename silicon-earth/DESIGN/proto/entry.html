const DAY_C   = ['#2b6f8f','#c2553a','#2f7f6f','#b07a22','#6f4a72','#56743a','#a34a5e','#43607a','#8f4626'];
const NIGHT_C = ['#6fc0e8','#f0a07a','#63cfb4','#e8c377','#bf8fd0','#a3c973','#e58ba0','#8fb2cf','#e08f66'];

let theme = (localStorage.getItem('sw_theme')==='night') ? 'night' : 'day';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ll2v(lat,lon){const p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;
  return {x:-Math.cos(t)*Math.sin(p), y:Math.cos(p), z:Math.sin(t)*Math.sin(p)};}
function basis(c){
  const up=Math.abs(c.y)>0.9?{x:1,y:0,z:0}:{x:0,y:1,z:0};
  let t1={x:c.y*up.z-c.z*up.y,y:c.z*up.x-c.x*up.z,z:c.x*up.y-c.y*up.x};
  const l1=Math.hypot(t1.x,t1.y,t1.z)||1;t1={x:t1.x/l1,y:t1.y/l1,z:t1.z/l1};
  const t2={x:c.y*t1.z-c.z*t1.y,y:c.z*t1.x-c.x*t1.z,z:c.x*t1.y-c.y*t1.x};
  return [t1,t2];
}

// ---- 陆块（多瓣，不是圆点） ----
const TOTAL_POINTS=9000;
const popSum=DATA.regions.reduce((s,r)=>s+r.population,0);
const pts=[], lobes=[];
DATA.regions.forEach((r,ri)=>{
  const n=Math.max(60,Math.round(TOTAL_POINTS*r.population/popSum));
  const rnd=mulberry32(7000+ri*131);
  const c=ll2v(r.lat,r.lon);
  const [t1,t2]=basis(c);
  const spread=r.kind==='badland'?0.10:0.25;
  const L=[]; const k=r.kind==='badland'?2:4+Math.floor(rnd()*3);
  for(let i=0;i<k;i++){const a=rnd()*Math.PI*2,d=(0.15+0.80*rnd())*spread;
    L.push({x:Math.cos(a)*d,y:Math.sin(a)*d,s:0.55+0.55*rnd()});}
  lobes.push({c,t1,t2,spread,L,n});
  for(let i=0;i<n;i++){
    const lb=L[i%L.length];
    const a=rnd()*Math.PI*2, rad=Math.sqrt(rnd())*spread*0.46*lb.s;
    const dx=lb.x+Math.cos(a)*rad, dy=lb.y+Math.sin(a)*rad;
    const d=Math.hypot(dx,dy)||1e-6, ca=Math.cos(d), sa=Math.sin(d);
    const x=c.x*ca+(t1.x*dx+t2.x*dy)/d*sa;
    const y=c.y*ca+(t1.y*dx+t2.y*dy)/d*sa;
    const z=c.z*ca+(t1.z*dx+t2.z*dy)/d*sa;
    const l=Math.hypot(x,y,z)||1;
    pts.push({x:x/l,y:y/l,z:z/l,r:ri});
  }
});

const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
let W=0,H=0,DPR=1,R=300,cx=0,cy=0;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cvs.width=W*DPR;cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2; cy=H/2+(W<720?-18:6);
  R=Math.min(W*0.42,H*0.42);
  document.body.classList.toggle('mobile',W<720);
}
addEventListener('resize',resize);resize();

let yaw=-0.52, pitch=-0.26, zoom=1, zTarget=1, dragging=false;
const yawV=0.0014;

function rot(p){
  const cy_=Math.cos(yaw),sy_=Math.sin(yaw);
  let x=p.x*cy_-p.z*sy_, z=p.x*sy_+p.z*cy_;
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  let y=p.y*cp-z*sp; z=p.y*sp+z*cp;
  return {x,y,z};
}
function scr(v,s){return {x:cx+v.x*R*s, y:cy-v.y*R*s, z:v.z};}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

function sphere(){
  const night = theme==='night';
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*zoom*1.02);
  if(night){
    g.addColorStop(0,'#2a4a64'); g.addColorStop(.48,'#17344c');
    g.addColorStop(.82,'#0d2030'); g.addColorStop(1,'#071320');
  }else{
    g.addColorStop(0,'#ffffff'); g.addColorStop(.44,'#eef5fb');
    g.addColorStop(.80,'#c6dcec'); g.addColorStop(1,'#93b7d1');
  }
  ctx.beginPath(); ctx.arc(cx,cy,R*zoom,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();

  // 昼夜面（物理上就是一条明暗界线，不是杂光）
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R*zoom,0,Math.PI*2); ctx.clip();
  const lg=ctx.createLinearGradient(cx-R*zoom,cy-R*zoom*.9,cx+R*zoom*.9,cy+R*zoom);
  lg.addColorStop(0, night?'rgba(120,185,235,.20)':'rgba(255,255,255,.55)');
  lg.addColorStop(.42,'rgba(255,255,255,0)');
  lg.addColorStop(.72, night?'rgba(0,0,0,.16)':'rgba(30,60,85,.06)');
  lg.addColorStop(1, night?'rgba(0,0,0,.46)':'rgba(30,60,85,.26)');
  ctx.fillStyle=lg; ctx.fillRect(cx-R*zoom,cy-R*zoom,R*zoom*2,R*zoom*2);
  ctx.restore();

  // 边缘光
  ctx.lineWidth=1.2;
  ctx.strokeStyle= night?'rgba(150,205,245,.40)':'rgba(255,255,255,.70)';
  ctx.beginPath(); ctx.arc(cx,cy,R*zoom-0.6,0,Math.PI*2); ctx.stroke();

  // 外辉
  const halo=ctx.createRadialGradient(cx,cy,R*zoom*.97,cx,cy,R*zoom*1.26);
  halo.addColorStop(0, night?'rgba(90,170,230,.24)':'rgba(120,165,200,.18)');
  halo.addColorStop(1, night?'rgba(90,170,230,0)':'rgba(120,165,200,0)');
  ctx.beginPath(); ctx.arc(cx,cy,R*zoom*1.26,0,Math.PI*2); ctx.fillStyle=halo; ctx.fill();
}

function graticule(){
  ctx.lineWidth=1;
  ctx.strokeStyle= theme==='night'?'rgba(140,190,230,0.10)':'rgba(70,110,140,0.075)';
  for(let lon=-180;lon<180;lon+=30){
    ctx.beginPath(); let has=false;
    for(let lat=-90;lat<=90;lat+=6){
      const v=rot(ll2v(lat,lon)); if(v.z<=0.02){has=false;continue;}
      const s=scr(v,zoom);
      if(has) ctx.lineTo(s.x,s.y); else {ctx.moveTo(s.x,s.y);has=true;}
    }
    ctx.stroke();
  }
  for(let lat=-60;lat<=60;lat+=30){
    ctx.beginPath(); let has=false;
    for(let lon=-180;lon<=180;lon+=6){
      const v=rot(ll2v(lat,lon)); if(v.z<=0.02){has=false;continue;}
      const s=scr(v,zoom);
      if(has) ctx.lineTo(s.x,s.y); else {ctx.moveTo(s.x,s.y);has=true;}
    }
    ctx.stroke();
  }
}

function blobs(){
  const C = theme==='night'?NIGHT_C:DAY_C;
  DATA.regions.forEach((r,ri)=>{
    const L=lobes[ri], v=rot(L.c);
    if(v.z<=-0.18) return;
    const s=scr(v,zoom);
    const rad=R*zoom*(r.kind==='badland'?0.115:0.30);
    const col=C[ri%C.length];
    const on=(sel==null||sel===ri);
    const g=ctx.createRadialGradient(s.x,s.y,rad*0.05,s.x,s.y,rad);
    if(theme==='night'){
      g.addColorStop(0,hexA(col,on?0.22:0.06));
      g.addColorStop(.6,hexA(col,on?0.09:0.02));
      g.addColorStop(1,hexA(col,0));
    }else{
      g.addColorStop(0,hexA(col,on?0.16:0.05));
      g.addColorStop(.65,hexA(col,on?0.06:0.02));
      g.addColorStop(1,hexA(col,0));
    }
    ctx.beginPath(); ctx.arc(s.x,s.y,rad,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  });
}

const arcs=[];
(function(){
  const rnd=mulberry32(4242);
  DATA.regions.forEach((r,ri)=>{
    for(let k=0;k<3;k++){
      let rj=ri;
      if(k<2) rj=(ri+1+(rnd()*3|0))%DATA.regions.length;
      if(rj===ri) continue;
      arcs.push({a:ri,b:rj,ph:rnd()*6.28,sp:0.4+rnd()*0.6});
    }
  });
})();

function drawArcs(){
  const t=performance.now()/1000;
  arcs.forEach(a=>{
    const A=ll2v(DATA.regions[a.a].lat,DATA.regions[a.a].lon);
    const B=ll2v(DATA.regions[a.b].lat,DATA.regions[a.b].lon);
    const steps=26; let prev=null;
    for(let i=0;i<=steps;i++){
      const u=i/steps;
      let x=A.x*(1-u)+B.x*u, y=A.y*(1-u)+B.y*u, z=A.z*(1-u)+B.z*u;
      const l=Math.hypot(x,y,z)||1; x/=l;y/=l;z/=l;
      const lift=1.0;
      const v=rot({x:x*lift,y:y*lift,z:z*lift});
      if(v.z<=0.05){prev=null;continue;}
      const s=scr(v,zoom);
      if(prev){
        const alpha = theme==='night' ? (0.10+0.09*Math.sin(t*a.sp+a.ph))
                                      : (0.06+0.05*Math.sin(t*a.sp+a.ph));
        ctx.strokeStyle = theme==='night' ? `rgba(150,200,240,${alpha})` : `rgba(80,110,130,${alpha})`;
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(s.x,s.y); ctx.stroke();
      }
      prev=s;
    }
  });
}

let sel=null;
function draw(){
  ctx.clearRect(0,0,W,H);
  sphere();
  graticule();
  blobs();
  drawArcs();

  const C = theme==='night'?NIGHT_C:DAY_C;
  const night = theme==='night';
  for(let i=0;i<pts.length;i++){
    const p=pts[i], v=rot(p);
    if(v.z<=0.02) continue;
    const s=scr(v,zoom);
    const on=(sel==null||sel===p.r);
    const col=C[p.r%C.length];
    if(night){
      // 光晕 + 灯芯
      ctx.globalAlpha=on?(0.10+0.22*v.z):0.02;
      ctx.fillStyle=col;
      ctx.fillRect(s.x-1.6,s.y-1.6,3.2,3.2);
      ctx.globalAlpha=on?(0.55+0.45*v.z):0.05;
      ctx.fillRect(s.x,s.y,1.5,1.5);
    }else{
      ctx.globalAlpha=on?(0.30+0.60*v.z):0.05;
      ctx.fillStyle=col;
      ctx.fillRect(s.x,s.y,v.z>0.55?2.1:1.4,v.z>0.55?2.1:1.4);
    }
  }
  ctx.globalAlpha=1;

  DATA.regions.forEach((r,ri)=>{
    const v=rot(ll2v(r.lat,r.lon));
    if(v.z<=0.10) return;
    if(sel!=null && sel!==ri) return;
    const s=scr(v,zoom);
    const dx=s.x-cx, dy=s.y-cy, d=Math.hypot(dx,dy)||1;
    let lx=s.x+dx/d*20, ly=s.y+dy/d*20;
    const vx=lx-cx, vy=ly-cy, vd=Math.hypot(vx,vy)||1, cap=R*zoom*0.95;
    if(vd>cap){lx=cx+vx/vd*cap; ly=cy+vy/vd*cap;}

    ctx.font='600 13.5px system-ui,"Microsoft YaHei"';
    ctx.textAlign=dx>6?'left':(dx<-6?'right':'center');
    ctx.textBaseline='middle';
    ctx.lineWidth=3.2;
    ctx.strokeStyle= night?'rgba(6,14,22,.85)':'rgba(250,246,238,.86)';
    ctx.strokeText(r.name,lx,ly);
    ctx.fillStyle= night?'#dbe9f5':'#3f342a';
    ctx.fillText(r.name,lx,ly);

    if(r.hot){
      const pulse=0.5+0.5*Math.sin(performance.now()/430);
      ctx.beginPath(); ctx.arc(s.x,s.y,9+pulse*10,0,Math.PI*2);
      ctx.strokeStyle=`rgba(240,150,90,${0.20+0.45*pulse})`; ctx.lineWidth=2; ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x,s.y,3.2,0,Math.PI*2);
      ctx.fillStyle='rgba(240,150,90,.95)'; ctx.fill();
    }
  });
}

function frame(){
  if(!dragging && sel==null) yaw += yawV;
  if(sel==null) zTarget=1;
  zoom += (zTarget-zoom)*0.09;
  draw();
  requestAnimationFrame(frame);
}

let moved=0, lx0=0, ly0=0;
cvs.addEventListener('pointerdown',e=>{
  dragging=true;moved=0;lx0=e.clientX;ly0=e.clientY;cvs.classList.add('drag');
  try{cvs.setPointerCapture(e.pointerId)}catch(_){}
});
cvs.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx=e.clientX-lx0, dy=e.clientY-ly0; lx0=e.clientX; ly0=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);
  yaw+=dx*0.0055; pitch=Math.max(-0.95,Math.min(0.95,pitch+dy*0.0045));
});
cvs.addEventListener('pointerup',e=>{
  dragging=false;cvs.classList.remove('drag');
  if(moved<6) pick(e.clientX,e.clientY);
});

function pick(mx,my){
  let best=-1,bd=1e9;
  DATA.regions.forEach((r,ri)=>{
    const v=rot(ll2v(r.lat,r.lon));
    if(v.z<=0.10) return;
    const s=scr(v,zoom);
    const d=Math.hypot(s.x-mx,s.y-my);
    if(d<bd){bd=d;best=ri;}
  });
  if(best>=0 && bd<Math.max(78,R*0.30)) openRegion(best);
}

  try{ v=JSON.parse(localStorage.getItem('silicon_last')||'null') }catch(e){}
  const el=document.getElementById('recall');
  if(!v){ el.style.display='none'; return }
  el.style.display='block';
  el.innerHTML=`你上次帮过 <b>${esc(v.name)}</b> · 第 ${v.day} 天 · 去看看 →`;
  el.onclick=()=>{ const i=DATA.regions.findIndex(r=>r.id===v.rid); if(i>=0) openRegion(i); };
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function openRegion(ri){
  sel=ri; zTarget=1.6;
  const r=DATA.regions[ri], p=r.person;
  body.innerHTML=`
    <div class="rname">${esc(r.name)}</div>
    <p class="rnote">${esc(r.note)}</p>
    <div>
      <span class="tag">${esc(r.state_cn)}</span>
      <span class="tag">${r.population} 人</span>
      <span class="tag">${DATA.day-r.last_event_day>0?`第 ${r.last_event_day} 天的事 · ${DATA.day-r.last_event_day} 天前`:`第 ${r.last_event_day} 天的事`}</span>
    </div>
    <div class="today">${esc(r.last_event)}</div>
    ${r.actors&&r.actors.length>1?`<div class="actors">涉事：${r.actors.map(esc).join(' · ')}${r.actors[0].split(' · ')[0]===r.actors[1].split(' · ')[0]?'（两个同名的人）':''}</div>`:''}
    <div class="epi">${esc(r.epigraph)}</div>
    ${r.recent&&r.recent.length?`<div class="recent">
      <div class="k">你 到 之 前 的 三 天</div>
      ${r.recent.map(x=>`<div class="rl"><span class="rd">第 ${x.day} 天</span>${esc(x.text)}</div>`).join('')}
    </div>`:''}
    ${p?`<div class="who">
      <div class="k">今 天 有 一 个 人</div>
      <div class="n">${esc(p.called)}<span class="h">${esc(p.handle.split(' · ').pop())}</span></div>
      <div class="u">${esc(p.unfinished)}</div>
      ${p.memory?`<div class="mem ${p.memory.kind==='lost'?'lost':''}">${{kept:'他记得',given:'这件事是别人告诉他的',lost:'他缺了一段'}[p.memory.kind]||'他记得'}：${esc(p.memory.text)}${p.memory.kind==='lost'?'<div class="mc">所以他记不清你是谁。</div>':''}</div>`:''}
      <div class="acts">
        <button data-act="help">帮</button>
        <button data-act="ask">问</button>
        <button data-act="mark">记</button>
      </div>
    </div>`:`<div class="who"><div class="u">这块地上今天没有人开口。</div></div>`}
    <div id="after"></div>`;
  panel.classList.add('on');
  body.querySelectorAll('button[data-act]').forEach(b=>{b.onclick=()=>act(b.dataset.act,r,p)});
}

function act(kind,r,p){
  body.querySelectorAll('button[data-act]').forEach(b=>b.disabled=true);
  if(kind==='mark'&&!book.includes(p.id)){book.push(p.id);saveBook(book);renderBook()}
  try{localStorage.setItem('silicon_last',JSON.stringify({rid:r.id,name:p.called+' · '+p.handle.split(' · ').pop(),day:DATA.day}))}catch(e){}
  renderRecall();
  const ev={help:'相助',ask:'求问',mark:'记名'}[kind];
  const mem={help:'你替他做的那件事，他记成了自己做的。',ask:'他说的时候，漏掉了一个人。',mark:'你把他写进册子，他并不知道。'}[kind];
  document.getElementById('after').innerHTML=`
    <div class="after">
      <div class="row"><div class="lbl">事件</div><div class="val">第 ${DATA.day} 天 · ${esc(r.name)} · 新增一条「${ev}」</div></div>
      <div class="row"><div class="lbl">记忆</div><div class="val">${esc(p.called)} 记住了这一天。${mem}（跨度 ${esc(p.memory_span)}）</div></div>
      <div class="row"><div class="lbl">数值</div><div class="val">${esc(r.name)} 积极度 ${r.positivity} → ${Math.min(100,r.positivity+1)}</div></div>
      <div class="stamp">世界已记账</div>
      <div class="row" style="border:0;padding-top:12px"><div class="lbl">之后</div><div class="val" style="opacity:.6">第 ${DATA.day+3} 天再来看：他可能记得、可能忘了、也可能记错了。</div></div>
      <div class="relink"><button id="go3">跳到第 ${DATA.day+3} 天</button></div>
    </div>`;
  const g=document.getElementById('go3');
  if(g) g.onclick=()=>returnVisit(r,p);
}

function returnVisit(r,p){
  const span=p.memory_span||'三年';
  let kind, text;
  if(span==='记不住'){ kind='记错了'; text=`他把这件事安在了别人头上，说得有名有姓。`; }
  else if(span==='三天'){ kind='忘了'; text=`他客气地问你是哪位，说这块地最近很忙。`; }
  else { kind='还记得'; text=`他说起那天，细节比你还清楚——包括你不希望他记住的那部分。`; }
  const box=document.getElementById('after');
  box.innerHTML=`
    <div class="after">
      <div class="stamp" style="border-color:rgba(217,164,65,.5);color:#b07a22">第 ${DATA.day+3} 天</div>
      <div class="row" style="border-top:1px dashed var(--card-line);margin-top:10px"><div class="lbl">他</div><div class="val"><b>${kind}</b>：${esc(text)}</div></div>
      <div class="row"><div class="lbl">这块地</div><div class="val">${esc(r.name)} 积极度 ${r.positivity+1} → ${r.positivity+2}，没有人注意到是谁带来的。</div></div>
      <div class="row" style="border:0"><div class="lbl">你</div><div class="val" style="opacity:.6">你可以再帮一次，也可以走开。</div></div>
      <div class="relink"><button id="back0">回到今天</button></div>
    </div>`;
  document.getElementById('back0').onclick=()=>openRegion(DATA.regions.findIndex(x=>x.id===r.id));
}

document.getElementById('back').onclick=()=>{sel=null;zTarget=1;panel.classList.remove('on')};

function setTheme(t){
  theme=t; try{localStorage.setItem('sw_theme',t)}catch(e){}
  document.body.classList.toggle('night', t==='night');
  document.getElementById('t-day').classList.toggle('on', t==='day');
  document.getElementById('t-night').classList.toggle('on', t==='night');
}
document.getElementById('t-day').onclick=()=>setTheme('day');
document.getElementById('t-night').onclick=()=>setTheme('night');

document.getElementById('day').textContent=DATA.day;
document.getElementById('pop').textContent=DATA.population;
document.getElementById('rc').textContent=DATA.regions.length;

(function(){
  if(/[?&]still=1/.test(location.search)) document.body.classList.add('still');
  const m=/[?&]r=([A-Za-z0-9]+)/.exec(location.search);
  if(m){
    const i=DATA.regions.findIndex(r=>String(r.id).toUpperCase()===m[1].toUpperCase());
    if(i>=0) setTimeout(()=>{
      openRegion(i);
      const r=DATA.regions[i], p=r.person;
      const a=/[?&]act=(help|ask|mark)/.exec(location.search);
      if(a && p) act(a[1],r,p);
      if(/[?&]ret=1/.test(location.search) && p) returnVisit(r,p);
    },150);
  }
  if(/[?&]theme=night/.test(location.search)) setTheme('night');
  else setTheme(theme);
  if(/[?&]last=1/.test(location.search)){
    try{localStorage.setItem('silicon_last',JSON.stringify({rid:'R03',name:'复核 · 530',day:DATA.day}))}catch(e){}
  }
  renderRecall();
})();

frame();
</script>
</html>
